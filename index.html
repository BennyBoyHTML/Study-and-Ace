  const c=rollBox(id),isNew=!owns(c.id);w.chars[c.id]=(w.chars[c.id]||0)+1;const n=w.chars[c.id];saveInv();syncCoins();
  const R=RARITY[c.r],big=RORDER.indexOf(c.r)>=3;
  const back=document.createElement('div');back.className='ub-back';back.style.setProperty('--rc',R.col);back.style.setProperty('--ba',b.a);back.style.setProperty('--bb',b.b);
  back.innerHTML=`<div class="ub" role="dialog" aria-modal="true" aria-label="Opening ${esc(b.n)}">
    <div class="ub-rays" aria-hidden="true"></div><div class="ub-flash" aria-hidden="true"></div>
    <div class="ub-stage" id="ubStage" tabindex="0" role="button" aria-label="Open the box">${boxArt(b,'ub-box drop')}</div>
    <div class="ub-char" aria-live="polite"><div class="ub-pop">${charHTML(c,190)}</div>
      <div class="ub-rar tt r-${c.r}">${R.n}${big?'!':''}</div><div class="ub-name tt">${esc(c.n)}</div>
      ${isNew?'<span class="ub-new tt">NEW!</span>':`<span class="ub-dup">You have ${n}</span>`}</div>
    <p class="ub-hint tt" id="ubHint">Tap to open!</p>
    <div class="ub-foot" id="ubFoot"></div></div>`;
  document.body.appendChild(back);const prev=keyHandler;let stage=0;const rm=reduceMotion();
  const close=()=>{back.remove();keyHandler=prev;if(V.view==='shop')render()};
  const stageEl=$('#ubStage',back),boxEl=$('.ub-box',back);
  setTimeout(()=>boxEl.classList.remove('drop'),rm?0:650);
  const reveal=()=>{stage=2;back.classList.add('revealed');boxEl.classList.add('burst');
    if(!rm){const r=stageEl.getBoundingClientRect();const x=r.left+r.width/2,y=r.top+r.height/2;fxBurst(x,y,R.col,46);fxBurst(x,y,'#FFFFFF',24);if(big)setTimeout(()=>fxBurst(x,y,'#FFCD1F',40),220)}
    beep(big?'clear':'good');if(big)confetti(c.r==='m'?320:c.r==='l'?240:160);
    const left=w.packs[id]||0,f=$('#ubFoot',back);
    f.innerHTML=`<button class="ub-btn ghost" id="ubDone">Done</button>${w.equipped!==c.id?`<button class="ub-btn blue" id="ubUse">Use ${esc(c.n)}</button>`:''}${left?`<button class="ub-btn gold" id="ubMore">Open another (${left})</button>`:w.coins>=b.price?`<button class="ub-btn gold" id="ubBuy">Buy another · 🪙 ${b.price}</button>`:''}`;
    $('#ubDone',back).onclick=close;
    const u=$('#ubUse',back);if(u)u.onclick=()=>{inv().equipped=c.id;saveInv();syncCoins();u.remove();toast(`${c.n} is now your character`)};
    const m=$('#ubMore',back);if(m)m.onclick=()=>{back.remove();keyHandler=prev;openBox(id)};
    const bb=$('#ubBuy',back);if(bb)bb.onclick=()=>{if(buyBox(id)){back.remove();keyHandler=prev;openBox(id)}};
    const first=$('#ubMore,#ubBuy,#ubUse,#ubDone',back);if(first)first.focus()};
  const open=()=>{if(stage)return;stage=1;$('#ubHint',back).textContent='';boxEl.classList.add('shake');beep('place');
    if(!rm){setTimeout(()=>beep('place'),380);setTimeout(()=>beep('place'),760)}
    setTimeout(reveal,rm?0:1150)};
  stageEl.onclick=open;
  keyHandler=e=>{if(e.key==='Escape'){if(stage===2)close()}else if((e.key===' '||e.key==='Enter')&&!stage){e.preventDefault();open()}};
  stageEl.focus();
}

/* first visit: pick one of three starters */
function maybeStarter(){
  if(!unlocked||!DB.settings.tutorialSeen||inv().starter||$('.modal-back')||$('.ub-back')||$('#starterPick'))return;
  const opts=CHARS.filter(c=>c.box==='starter'),info={ember:'Bold and fiery. Loves a challenge.',frostbite:'Cool under pressure. Never panics on a test.',sprout:'Slow and steady. Grows a little smarter every day.'};
  const back=document.createElement('div');back.className='ub-back starter-back';back.id='starterPick';
  back.innerHTML=`<div class="starter" role="dialog" aria-modal="true" aria-labelledby="stT"><h2 class="tt" id="stT">Choose your starter!</h2><p class="st-sub">Your character joins you in every game. You can collect more than 100 others in the Market.</p>
    <div class="st-row">${opts.map((c,i)=>`<button class="st-card" data-id="${c.id}" style="--rc:${RARITY[c.r].col};--d:${i*.12}s"><span class="st-glow"></span>${charHTML(c,130)}<b class="tt">${esc(c.n)}</b><span>${info[c.id]||''}</span><span class="ub-btn blue sm">Pick ${esc(c.n)}</span></button>`).join('')}</div></div>`;
  document.body.appendChild(back);const prev=keyHandler;keyHandler=()=>{};
  $$('.st-card',back).forEach(b=>b.onclick=()=>{const w=inv(),c=CHAR_BY_ID[b.dataset.id];w.chars[c.id]=(w.chars[c.id]||0)+1;w.equipped=c.id;w.starter=c.id;w.packs.farm=(w.packs.farm||0)+1;saveInv();syncCoins(true);
    $$('.st-card',back).forEach(x=>x.classList.toggle('chosen',x===b));beep('clear');confetti(200);
    setTimeout(()=>{back.remove();keyHandler=prev;toast(`${c.n} joined you! A free Farm Box is in your inventory.`);if(V.view==='shop')render()},900)});
  $('.st-card',back).focus();
}

VIEWS.shop=()=>{
  const w=inv(),me=myChar(),dc=dailyChar(),tab=V.tab||'market';
  const nOwned=CHARS.filter(c=>owns(c.id)).length,nBoxes=Object.values(w.packs).reduce((a,b)=>a+b,0),freeReady=w.freeDay!==dayKey(),fb=BOX_BY_ID[freeBoxId()];
  const earnToday=w.earned&&w.earned.day===dayKey()?w.earned.n:0;
  app.innerHTML=`<div class="market">
    <div class="mk-top"><div><h1 class="tt">Market</h1><p>${nOwned} of ${CHARS.length} characters collected · ${earnToday.toLocaleString()} coins earned today</p></div>
      <div class="mk-coins tt"><span>🪙</span>${w.coins.toLocaleString()}</div></div>
    <div class="mk-tabs" role="tablist">${[['market','🛒 Market'],['inv',`🎒 Inventory${nBoxes?` <span class="tab-dot">${nBoxes}</span>`:''}`],['dex','📖 Collection']].map(([k,l])=>`<button role="tab" class="tt" data-stab="${k}" aria-selected="${tab===k}">${l}</button>`).join('')}</div>
    <div id="shopBody"></div></div>`;
  const body=$('#shopBody');
  const mini=(c,opts={})=>{const n=w.chars[c.id]||0,has=n>0;
    return `<div class="mk-char ${has?'':'locked'} ${w.equipped===c.id?'using':''}" style="--rc:${RARITY[c.r].col}">${n>1?`<span class="cc-count">×${n}</span>`:''}${charHTML(c,80,has?'':'silhouette')}
      <b>${has||opts.show?esc(c.n):'???'}</b><span class="rarity-pill sm r-${c.r}">${RARITY[c.r].n}</span>
      ${has&&!opts.noAct?`<div class="cc-acts"><button class="ub-btn sm ${w.equipped===c.id?'ghost':'blue'}" data-equip="${c.id}" ${w.equipped===c.id?'disabled':''}>${w.equipped===c.id?'Using':'Use'}</button>${n>1?`<button class="ub-btn sm gold" data-sell="${c.id}">Sell +${SELL[c.r]}</button>`:''}</div>`:''}</div>`};
  const draw=()=>{
    if(tab==='market'){
      body.innerHTML=`<div class="mk-feature">
        <div class="mk-panel me-panel">${charHTML(me,120)}<div><span class="mk-label">Your character</span><h2 class="tt">${esc(me.n)}</h2><span class="rarity-pill r-${me.r}">${RARITY[me.r].n}</span></div></div>
        <div class="mk-panel free-panel" style="--a:${fb.a};--b:${fb.b}">${boxArt(fb,'sm')}<div><span class="mk-label">Free every day</span><h2 class="tt">Free ${esc(fb.n)}</h2>${freeReady?'<button class="ub-btn gold" id="freeBtn">Open free box</button>':'<p class="muted2">Opened! Next free box in <b class="nextDay"></b></p>'}</div></div>
        <div class="mk-panel feat-panel" style="--rc:${RARITY[dc.r].col}">${charHTML(dc,104,owns(dc.id)?'':'silhouette-soft')}<div><span class="mk-label">Today’s featured · 8× luck</span><h2 class="tt">${esc(dc.n)}</h2><span class="rarity-pill r-${dc.r}">${RARITY[dc.r].n}</span><p class="muted2">In the ${esc(BOX_BY_ID[dc.box].n)} · <b class="nextDay"></b> left</p></div></div></div>
        <div class="mk-grid">${BOXES.map(b=>{const have=w.packs[b.id]||0,list=boxChars(b.id),got=list.filter(c=>owns(c.id)).length;
          return `<div class="mk-box" style="--a:${b.a};--b:${b.b};--bg:${b.bg}">
            <div class="mk-box-art">${boxArt(b)}${have?`<span class="mk-have tt">×${have}</span>`:''}</div>
            <h3 class="tt">${b.n}</h3><p>${b.desc}</p>
            <div class="mk-prev">${list.slice().sort((x,y)=>RORDER.indexOf(y.r)-RORDER.indexOf(x.r)).slice(0,5).map(c=>charHTML(c,34,owns(c.id)?'mini':'mini silhouette')).join('')}<span>${got}/${list.length}</span></div>
            <div class="mk-acts"><button class="ub-btn gold ${w.coins>=b.price?'':'poor'}" data-buybox="${b.id}">🪙 ${b.price.toLocaleString()}</button>${have?`<button class="ub-btn blue" data-open="${b.id}">Open</button>`:''}<button class="ub-btn ghost sm" data-rates="${b.id}" aria-label="Drop rates for ${b.n}">%</button></div></div>`}).join('')}</div>`;
      const fbn=$('#freeBtn');if(fbn)fbn.onclick=claimFree;
    }else if(tab==='inv'){
      const boxes=BOXES.filter(b=>w.packs[b.id]>0),mine=CHARS.filter(c=>owns(c.id)).sort((a,b)=>RORDER.indexOf(b.r)-RORDER.indexOf(a.r));
      const extra=mine.reduce((a,c)=>a+Math.max(0,w.chars[c.id]-1)*SELL[c.r],0);
      body.innerHTML=`<div class="mk-section"><h2 class="tt">Unopened boxes</h2>
        ${boxes.length?`<div class="inv-boxes">${boxes.map(b=>`<div class="inv-box" style="--a:${b.a};--b:${b.b};--bg:${b.bg}">${boxArt(b,'sm')}<b class="tt">${b.n}</b><span class="mk-have tt">×${w.packs[b.id]}</span><button class="ub-btn blue sm" data-open="${b.id}">Open</button></div>`).join('')}</div>`:`<p class="muted">No boxes yet. <button class="linkbtn" data-stab="market">Visit the Market</button></p>`}</div>
        <div class="mk-section"><div class="mk-sec-head"><h2 class="tt">My characters (${mine.length})</h2>${extra?`<button class="ub-btn gold sm" id="sellAll">Sell all extras · +${extra.toLocaleString()}</button>`:''}</div>
        <div class="mk-chars stagger">${mine.map(c=>mini(c)).join('')}</div></div>`;
      const sa=$('#sellAll');if(sa)sa.onclick=()=>{let got=0;CHARS.forEach(c=>{const n=w.chars[c.id]||0;if(n>1){got+=(n-1)*SELL[c.r];w.chars[c.id]=1}});w.coins+=got;saveInv();syncCoins(true);beep('good');toast(`Sold extras for ${got.toLocaleString()} coins`);render()};
    }else{
      body.innerHTML=[...BOXES,{id:'starter',n:'Starters',a:'#45B0FF',b:'#4255FF',bg:'#E2E8FF',icon:'⭐'}].map(b=>{const list=boxChars(b.id).sort((x,y)=>RORDER.indexOf(x.r)-RORDER.indexOf(y.r)),got=list.filter(c=>owns(c.id)).length;
        return `<div class="mk-section dex" style="--a:${b.a};--b:${b.b};--bg:${b.bg}"><div class="mk-sec-head"><h2 class="tt"><span class="dex-ic">${b.icon}</span>${b.n}</h2><span class="dex-count tt">${got}/${list.length}</span></div>
          <div class="dex-bar"><i style="width:${got/list.length*100}%"></i></div><div class="mk-chars stagger">${list.map(c=>mini(c)).join('')}</div></div>`}).join('');
    }
    stagger(body);updNext();
  };
  const ratesModal=id=>{const b=BOX_BY_ID[id],rates=boxRates(id);
    const back=document.createElement('div');back.className='modal-back';
    back.innerHTML=`<div class="modal rates-modal" role="dialog" aria-modal="true" aria-labelledby="rtT" style="--a:${b.a};--b:${b.b}"><header><h2 class="tt" id="rtT">${b.n} drop rates</h2><p>Each box holds 1 character. Today’s featured character is 8× more likely.</p></header>
      <div class="deck-list">${rates.map(r=>`<div class="rate-row r-${r.r}" style="--rc:${RARITY[r.r].col}"><div class="rate-head"><span class="rarity-pill r-${r.r}">${RARITY[r.r].n}</span><b>${fmtPct(r.p)}</b></div><div class="rate-chars">${r.chars.map(c=>`<span title="${esc(c.n)} · ${fmtPct(r.p/r.chars.length)}">${charHTML(c,44,owns(c.id)?'mini':'mini silhouette')}<small>${owns(c.id)?esc(c.n):'???'}</small></span>`).join('')}</div></div>`).join('')}</div>
      <footer><span></span><button class="btn primary" id="rtX">Close</button></footer></div>`;
    document.body.appendChild(back);const prev=keyHandler;const close=()=>{back.remove();keyHandler=prev};keyHandler=e=>{if(e.key==='Escape')close()};back.onclick=e=>{if(e.target===back)close()};$('#rtX',back).onclick=close};
  body.onclick=e=>{let t;
    if(t=e.target.closest('[data-buybox]')){const id=t.dataset.buybox;if(buyBox(id)){openBox(id)}}
    else if(t=e.target.closest('[data-open]'))openBox(t.dataset.open);
    else if(t=e.target.closest('[data-rates]'))ratesModal(t.dataset.rates);
    else if(t=e.target.closest('[data-equip]')){w.equipped=t.dataset.equip;saveInv();syncCoins();beep('place');render();toast(`${myChar().n} is now your character`)}
    else if(t=e.target.closest('[data-sell]')){const c=CHAR_BY_ID[t.dataset.sell];if((w.chars[c.id]||0)>1){w.chars[c.id]--;w.coins+=SELL[c.r];saveInv();syncCoins(true);beep('good');render()}}
    else if(t=e.target.closest('[data-stab]')){V.tab=t.dataset.stab;render()}};
  $$('.mk-tabs [data-stab]').forEach(b=>b.onclick=()=>{V.tab=b.dataset.stab;render()});
  const updNext=()=>{const n=new Date(),m=new Date(n);m.setHours(24,0,0,0);const x=Math.max(0,(m-n)/1000|0);$$('.nextDay').forEach(el=>el.textContent=`${x/3600|0}h ${(x%3600)/60|0}m`)};
  const iv=setInterval(updNext,30000);cleanups.push(()=>clearInterval(iv));
  draw();

syncCoins();

/* ---------- how-to-use tutorial ---------- */
const tutSteps=()=>{const g=isQuickOnly();return [
  {e:'\u{1F44B}',c:'#4255FF',t:'Welcome to Study and Ace',p:g?'An arcade of quick, fun games you can play right away. Here is a 30-second tour.':'Study anything with flashcards, tests and games. Here is a one-minute tour of how it works.',tip:'Use the arrow keys or the buttons below to move through the tour.'},
  ...(g?[]:[
  {e:'✍️',c:'#18AE79',t:'1. Make a study set',p:'Press “+ Create” at the top. Give your set a title, then type a term and its definition on each card. You can also paste a list, upload a PDF, or let AI write the cards for you.',tip:'Tap the picture button on a card to add a photo, a flag or an emoji. Made cards with AI? Press Regenerate for a fresh batch.'},
  {e:'\u{1F5C2}️',c:'#FF8A3D',t:'2. Study your set',p:'Open a set from your Library to use Flashcards, Learn, Test and Write. Learn starts with multiple choice and then has you type the answers until you know every term.',tip:'“Answer with” on a set flips which side you get quizzed on.'}]),
  {e:'\u{1F3AE}',c:'#8F7BFF',t:g?'Play games':'3. Play games',p:g?'Open Games, pick any game and press Play. Every game has built-in questions about flags, animals, space and science, so there is nothing to study first.':'Open the Games tab, pick a game and press Play. Then pick one of your card decks to play with, or Quick Play for built-in questions about flags, animals, space and science.',tip:'Games speed up as you go. Answer correctly in a row for streak bonuses.'},
  {e:'\u{1F525}',c:'#FF5D6C',t:g?'Daily Puzzle':'4. Daily challenges',p:g?'Every day there is a new Daily Puzzle: guess the mystery word in 6 tries. Come back each day to grow your streak.':'Every day there is a new Daily Puzzle (guess the mystery word in 6 tries) and a Daily Test made from your sets. Finish them every day to grow your streaks.',tip:g?'Green means right letter, right spot. Yellow means right letter, wrong spot.':'Your goals for the day are on the home page.'},
  {e:'\u{1F6CD}\uFE0F',c:'#FF73C3',t:'Characters and the Shop',p:'You earn coins every time you study and play. Studying pays the most. Spend them in the Market on themed boxes, then unbox them to collect more than 100 characters, from Common to Mythic. Your character joins you in every game. There’s a free pack every day.',tip:'Get a free box in the Market every day.'},
  {e:'⚙️',c:'#2E3856',t:'Helper, AI and settings',p:'The built-in helper is always on: it turns notes into cards and writes practice tests, with no download. The \u2728 button can also turn on Google’s AI in Chrome for any topic. The ⚙️ gear has sound and music settings.',tip:'Press ❓ at the top anytime to see this tour again.'}]};
let tutShown=false;
function openTutorial(){
  if($('#tutModal'))return;tutShown=true;const steps=tutSteps();let i=0;
  const back=document.createElement('div');back.className='modal-back';
  back.innerHTML=`<div class="modal tut" id="tutModal" role="dialog" aria-modal="true" aria-labelledby="tutT"><div class="tut-body" id="tutBody"></div>
    <footer><button class="btn ghost" id="tutSkip">Skip tour</button><div class="row"><button class="btn" id="tutBack">Back</button><button class="btn primary" id="tutNext">Next</button></div></footer></div>`;
  document.body.appendChild(back);const prev=keyHandler;
  const close=()=>{back.remove();keyHandler=prev;DB.settings.tutorialSeen=true;save();setTimeout(maybeStarter,500)};
  const draw=()=>{const st=steps[i];
    $('#tutBody',back).innerHTML=`<div class="tut-art" style="--c:${st.c}"><span>${st.e}</span></div>
      <div class="tut-dots" aria-hidden="true">${steps.map((_,k)=>`<i class="${k===i?'on':k<i?'done':''}"></i>`).join('')}</div>
      <h2 id="tutT">${st.t}</h2><p>${st.p}</p>${st.tip?`<div class="tut-tip">\u{1F4A1} ${st.tip}</div>`:''}
      <span class="sr" aria-live="polite">Step ${i+1} of ${steps.length}</span>`;
    $('#tutBack',back).disabled=i===0;$('#tutNext',back).textContent=i===steps.length-1?'Let’s go!':'Next';$('#tutNext',back).focus()};
  $('#tutNext',back).onclick=()=>{if(i<steps.length-1){i++;draw()}else{close();beep('clear')}};
  $('#tutBack',back).onclick=()=>{if(i>0){i--;draw()}};
  $('#tutSkip',back).onclick=close;
  keyHandler=e=>{if(e.key==='Escape')close();else if(e.key==='ArrowRight')$('#tutNext',back).click();else if(e.key==='ArrowLeft')$('#tutBack',back).click()};
  draw();
}
$('#helpBtn').onclick=openTutorial;
const maybeTutorial=()=>{if(unlocked&&!DB.settings.tutorialSeen&&!tutShown&&['library','games'].includes(V.view)){tutShown=true;setTimeout(()=>{if(!$('.modal-back'))openTutorial()},700)}};

render();
})();
