    const NEED=Math.min(10,Math.max(5,s.cards.length)),T={Easy:[16,22],Medium:[10.5,14],Hard:[7,9.5]}[diff].map(x=>x*NEED);
    const bots=[{name:'Speedy Sam',c:'#45B0FF',t:T[0],pos:0,fin:null},{name:'Cruising Kai',c:'#23C483',t:T[1],pos:0,fin:null}];
    let mine=0,stall=0,q=null,last=performance.now(),place=null;const t0=last,next=deckOf(s.cards),missed=new Map();
    gw.innerHTML=`<div class="track">${[{name:'You',c:'#FF5D6C',me:true},...bots].map((b,i)=>`<div class="lane ${b.me?'me':''}"><span class="lname">${esc(b.name)}</span><div class="lroad"><div class="car" id="car${i}">${CAR(b.c)}</div><span class="finish"></span></div></div>`).join('')}</div>
      <div class="race-q"><span class="pq-l">Definition · type the term</span><div class="pq-t" id="rq"></div>
      <form class="gv-input" id="rf" autocomplete="off"><label for="ri" class="sr">Your answer</label><input id="ri" type="text" placeholder="Type the term and press Enter" autocapitalize="off" spellcheck="false"><button class="btn primary">Go</button></form>
      <div class="gnote" id="gn">Each right answer moves you ${Math.round(100/NEED)}% of the way. Finish ${NEED} to cross the line.</div></div>`;
    const inp=$('#ri');
    const newQ=()=>{q=next();$('#rq').innerHTML=(q.img?`<span class="race-img">${imgHTML(q.img)}</span>`:'')+`<span>${esc(q.d)}</span>`;inp.value='';inp.focus()};newQ();
    const cars=[0,1,2].map(i=>$('#car'+i));
    const put=(el,p)=>{el.style.left=`calc(${(p*100).toFixed(2)}% - ${(p*58).toFixed(1)}px)`};
    $('#rf').onsubmit=e=>{e.preventDefault();if(!running||stall>0||mine>=NEED)return;const v=inp.value;if(!v.trim())return;
      const r=grade(v,q.t);
      if(r!=='wrong'){mine++;beep('good');fxEl(cars[0],r==='close'?'Close enough!':'Boost!');cars[0].classList.remove('boost');void cars[0].offsetWidth;cars[0].classList.add('boost');$('#gn').innerHTML=`${mine}/${NEED} · <b>${esc(q.t)}</b>`;
        if(mine>=NEED){finish();return}newQ()}
      else{stall=1.4;missed.set(q.id,q);beep('bad');cars[0].classList.remove('spin');void cars[0].offsetWidth;cars[0].classList.add('spin');$('#gn').innerHTML=`Spun out! It was <b>${esc(q.t)}</b>.`;inp.disabled=true;setTimeout(()=>{if(!inp.isConnected)return;inp.disabled=false;newQ()},1400)}};
    const loop=t=>{if(!running)return;const dt=Math.min(.05,(t-last)/1000);last=t;if(stall>0)stall-=dt;const el=(t-t0)/1000;
      bots.forEach((b,i)=>{b.pos=Math.min(1,el/b.t);if(b.pos>=1&&b.fin==null)b.fin=el;put(cars[i+1],b.pos)});put(cars[0],mine/NEED);
      const ahead=bots.filter(b=>b.pos>mine/NEED).length;$('#aP').textContent=['1st','2nd','3rd'][ahead];$('#aT').textContent=el.toFixed(1)+'s';
      raf=requestAnimationFrame(loop)};
    function finish(){running=false;cancelAnimationFrame(raf);put(cars[0],1);const el=(performance.now()-t0)/1000;place=bots.filter(b=>b.fin!=null).length+1;
      $('#aP').textContent=['1st','2nd','3rd'][place-1];if(place===1)confetti(160);
      setTimeout(()=>gameEnd(gw,{s,gid:'race',value:Math.round(el*10)/10,title:place===1?'You won the race!':place===2?'Second place!':'You finished third',sub:`${diff} race · ${NEED} answers in ${el.toFixed(1)} seconds.`,missed:[...missed.values()],onAgain:start}),800)}
    running=true;raf=requestAnimationFrame(loop);
  };
  const intro=()=>{gw.innerHTML=splashHTML(g,`<div class="seg" role="group" aria-label="Difficulty">${['Easy','Medium','Hard'].map(d=>`<button data-d="${d}" aria-pressed="${d===diff}">${d}</button>`).join('')}</div>`);
    $$('[data-d]',gw).forEach(b=>b.onclick=()=>{diff=b.dataset.d;$$('[data-d]',gw).forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});
    $('#go').onclick=()=>countdown(gw,start)};
  intro();
};

/* ---------- card images: uploads, built-in flags, emoji ---------- */
function imgHTML(img,cls=''){
  if(!img)return '';
  if(img.startsWith('flag:')&&FLAGS[img.slice(5)])return flagSVG(img.slice(5),'flag '+cls);
  if(img.startsWith('emoji:'))return `<span class="emo ${cls}">${esc(img.slice(6))}</span>`;
  if(/^data:image\/(png|jpe?g|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(img))return `<img class="cimg ${cls}" src="${img}" alt="">`;
  return '';
}
const qImg=(card,cls='')=>card&&card.img?`<div class="qimg ${cls}">${imgHTML(card.img)}</div>`:'';
const COUNTRY_ALIASES={'usa':'US','us':'US','united states of america':'US','america':'US','uk':'GB','great britain':'GB','britain':'GB','czech republic':'CZ','cote divoire':'CI','cote d ivoire':'CI','holland':'NL','uae':'AE'};
function countryCode(t){const n=norm(t||'');if(!n)return null;if(COUNTRY_ALIASES[n])return COUNTRY_ALIASES[n];const c=COUNTRIES.find(c=>norm(c.n)===n);return c?c.code:null}
function compressImage(file){
  return new Promise((res,rej)=>{
    if(!file||!/^image\//.test(file.type))return rej(new Error('not an image'));
    const url=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{const M=320,sc=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(im.width*sc));c.height=Math.max(1,Math.round(im.height*sc));c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);
      let d=c.toDataURL('image/webp',.8);if(!d.startsWith('data:image/webp'))d=c.toDataURL('image/jpeg',.82);res(d)};
    im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('could not read image'))};
    im.src=url;
  });
}
const IMG_ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>';
const EMOJI_PICKS=['\u{1F34E}','\u{1F9EA}','\u{1F30D}','\u{1F4DA}','\u{1F52C}','\u{1F9EC}','\u{1F3B5}','⚽','\u{1F436}','\u{1F431}','\u{1F30B}','\u{1F680}','\u{1F3DB}️','\u{1F9EE}','\u{1F4A1}','\u{1F9E0}','\u{1F331}','\u{1F355}','\u{1F3A8}','❤️','\u{1F319}','☀️','\u{1F30A}','\u{1F3F0}'];
function pickImage(card,done){
  const back=document.createElement('div');back.className='modal-back';let tab='upload',q='';
  back.innerHTML=`<div class="modal ip" role="dialog" aria-modal="true" aria-labelledby="ipT"><header><h2 id="ipT" style="font-size:21px">Add an image</h2><p>For “${esc(card.t||'this card')}”. It shows up with this card in flashcards, tests and games.</p>
    <div class="seg" role="group" aria-label="Image source" style="margin-top:10px"><button data-tab="upload" aria-pressed="true">Upload</button><button data-tab="flag" aria-pressed="false">Flags</button><button data-tab="emoji" aria-pressed="false">Emoji</button></div></header>
    <div class="deck-list" id="ipBody"></div>
    <footer>${card.img?'<button class="btn bad sm" id="ipRemove">Remove image</button>':'<span></span>'}<button class="btn" id="ipX">Cancel</button></footer></div>`;
  document.body.appendChild(back);const prev=keyHandler;
  const close=()=>{back.remove();keyHandler=prev;document.removeEventListener('paste',onPaste)};
  const set=img=>{card.img=img;close();done()};
  const fromFile=async f=>{const st=$('#ipSt',back);try{if(st)st.textContent='Shrinking image…';set(await compressImage(f))}catch(e){if(st){st.className='ai-status err';st.textContent='That file isn’t an image this browser can read. Try a JPG or PNG.'}}};
  const onPaste=e=>{const it=[...(e.clipboardData&&e.clipboardData.items||[])].find(i=>i.type.startsWith('image/'));if(it){e.preventDefault();fromFile(it.getAsFile())}};
  document.addEventListener('paste',onPaste);
  const draw=()=>{const b=$('#ipBody',back);
    if(tab==='upload'){b.innerHTML=`<label class="drop" id="ipDrop"><input type="file" accept="image/*" id="ipFile"><span class="drop-ic">${IMG_ICON}</span><b>Choose an image</b><span>or drag it here, or paste with Ctrl+V / Cmd+V</span></label><div class="ai-status" id="ipSt"></div>
      <p class="ai-note">Images are shrunk to save space and stored only in this browser.</p>`;
      $('#ipFile',b).onchange=e=>{const f=e.target.files[0];if(f)fromFile(f)};
      const dz=$('#ipDrop',b);dz.ondragover=e=>{e.preventDefault();dz.classList.add('over')};dz.ondragleave=()=>dz.classList.remove('over');dz.ondrop=e=>{e.preventDefault();dz.classList.remove('over');const f=e.dataTransfer.files[0];if(f)fromFile(f)}}
    else if(tab==='flag'){const guess=countryCode(card.t)||countryCode(card.d);
      const list=COUNTRIES.filter(c=>!q||norm(c.n).includes(norm(q)));
      b.innerHTML=`<label for="ipQ" class="sr">Search countries</label><input id="ipQ" type="text" placeholder="Search ${COUNTRIES.length} countries" value="${esc(q)}">
        ${guess&&!q?`<button class="btn sm primary" id="ipGuess">${flagSVG(guess,'flag mini')}Use the flag of ${esc(COUNTRIES.find(c=>c.code===guess).n)}</button>`:''}
        <div class="flag-grid">${list.map(c=>`<button class="fg" data-code="${c.code}" title="${esc(c.n)}">${flagSVG(c.code)}<span>${esc(c.n)}</span></button>`).join('')||'<p class="empty">No country by that name.</p>'}</div>`;
      const qi=$('#ipQ',b);qi.oninput=()=>{q=qi.value;draw();const n=$('#ipQ',back);n.focus();n.setSelectionRange(n.value.length,n.value.length)};
      $$('.fg',b).forEach(x=>x.onclick=()=>set('flag:'+x.dataset.code));const g=$('#ipGuess',b);if(g)g.onclick=()=>set('flag:'+guess)}
    else{b.innerHTML=`<div class="emoji-grid">${EMOJI_PICKS.map(e=>`<button class="eg" data-e="${e}">${e}</button>`).join('')}</div>
      <div class="row"><label for="ipE" class="sr">Any emoji</label><input id="ipE" type="text" maxlength="12" placeholder="Or type or paste any emoji" style="flex:1"><button class="btn primary" id="ipUse">Use</button></div>`;
      $$('.eg',b).forEach(x=>x.onclick=()=>set('emoji:'+x.dataset.e));
      $('#ipUse',b).onclick=()=>{const v=$('#ipE',b).value.trim();if(v)set('emoji:'+[...v].slice(0,4).join(''))}}
  };
  $$('[data-tab]',back).forEach(t=>t.onclick=()=>{tab=t.dataset.tab;$$('[data-tab]',back).forEach(x=>x.setAttribute('aria-pressed',String(x===t)));draw()});
  keyHandler=e=>{if(e.key==='Escape')close()};back.onclick=e=>{if(e.target===back)close()};
  $('#ipX',back).onclick=close;const rm=$('#ipRemove',back);if(rm)rm.onclick=()=>set(null);
  if(countryCode(card.t)||countryCode(card.d)){tab='flag';$$('[data-tab]',back).forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.tab==='flag')))}
  draw();
}

/* ---------- Picture Quiz ---------- */
VIEWS.picture=()=>{
  const gv=gameView('picture');if(!gv)return;const {s,g}=gv;
  app.innerHTML=`${modeBar(s,g.name,stat('Score',0,'qS')+stat('Question','1/12','qQ')+stat('Streak',0,'qK')+stat('Best',esc(fmtBest('picture',s.best.picture)),'qB'))}<div class="game" id="gw"></div>`;
  const gw=$('#gw'),pool=s.cards.filter(c=>c.img);
  if(pool.length<4){gw.innerHTML=`<div class="splash"><h2>Add some pictures first</h2><p>Picture Quiz needs at least 4 cards with images. Open the set editor and tap the image button on a card. Country cards can get flags in one click.</p><div class="row" style="justify-content:center"><button class="btn primary" data-nav="edit" data-id="${s.id}">Edit this set</button><button class="btn" data-nav="games">Back to games</button></div></div>`;return}
  const start=()=>{const list=shuffle(pool).slice(0,Math.min(12,pool.length));
    runQuiz(gw,{s,gid:'picture',total:list.length,timer:12,title:'Picture perfect!',onAgain:start,make:i=>{const c=list[i];
      const others=shuffle(s.cards.filter(x=>x!==c&&norm(x.t)!==norm(c.t))).slice(0,3),opts=shuffle([c,...others]);
      return {prompt:`<div class="pic-big">${imgHTML(c.img)}</div><span class="pq-l">What is this?</span>`,options:opts.map(o=>({html:esc(o.t),text:o.t,correct:o===c})),miss:{html:`${imgHTML(c.img,'mini')}<span>${esc(c.t)}</span>`}}}})};
  gw.innerHTML=splashHTML(g,`<div class="flag-parade">${shuffle(pool).slice(0,6).map(c=>`<span class="pp">${imgHTML(c.img)}</span>`).join('')}</div>`);$('#go').onclick=()=>countdown(gw,start);
};

/* ---------- give example sets their flags, and add Flags of the World ---------- */
(function migrateImages(){let ch=false;
  DB.sets.forEach(s=>{if(s.sample&&s.title==='World Capitals')s.cards.forEach(c=>{if(!c.img){const k=countryCode(c.t);if(k){c.img='flag:'+k;ch=true}}})});
  if(!DB.flagSetAdded){DB.flagSetAdded=true;ch=true;
    if(!DB.sets.some(s=>s.title==='Flags of the World'))DB.sets.push({id:uid(),title:'Flags of the World',desc:'Every country’s flag with its capital city. Each game round shows a flag.',sample:true,best:{},cards:COUNTRIES.filter(c=>c.cap).map(c=>({id:uid(),t:c.n,d:c.cap,img:'flag:'+c.code}))})}
  if(ch)save()})();

render();
})();
