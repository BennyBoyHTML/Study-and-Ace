<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Study and Ace</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Bungee&family=Titan+One&family=Noto+Color+Emoji&display=swap">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="favicon-180.png">    
<style>
/* Layout: clean study-app look; white cards on a cool gray page, one bright blue for actions, navy game boards; one centered column, max 1080px */
:root{
  --paper:#F6F7FB; --card:#FFFFFF; --card-2:#EDEFF4; --ink:#282E3E; --muted:#586380; --rule:#D9DDE8; --margin:#4255FF;
  --accent:#4255FF; --accent-hover:#3A47D6; --accent-soft:#E8EBFF; --link:#4255FF; --on-accent:#FFFFFF; --hi:#FFCD1F; --line:#D9DDE8;
  --go:#18AE79; --go-bg:#E2F7EF; --bad:#E0393E; --bad-bg:#FDE8E8; --ai:#7A4DFF; --ai-soft:#F0EBFF;
  --shadow:0 4px 16px rgba(46,56,86,.08); --shadow-lg:0 8px 28px rgba(46,56,86,.14);
  --board:#0A092D; --board-2:#2E3856; --board-ink:#F6F7FB; --board-muted:#A6AECB;
  --b1:#FF5D6C; --b2:#FFA53D; --b3:#FFCD1F; --b4:#23C483; --b5:#45B0FF; --b6:#8F7BFF; --b7:#FF73C3;
  --f-display:"Bungee",Impact,"Arial Black",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0A092D; --card:#2E3856; --card-2:#232B47; --ink:#F6F7FB; --muted:#B7BFD8; --rule:#45507A; --margin:#A8B1FF;
  --accent:#4255FF; --accent-hover:#5A6BFF; --accent-soft:#252F6B; --link:#A8B1FF; --on-accent:#FFFFFF; --line:#45507A;
  --go:#3FDCA0; --go-bg:#173F3A; --bad:#FF7B7F; --bad-bg:#4A2333; --ai:#B9A2FF; --ai-soft:#2E2A63;
  --shadow:0 4px 16px rgba(0,0,0,.3); --shadow-lg:0 8px 28px rgba(0,0,0,.45);
  --board:#1A1D4A; --board-2:#2E3856;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0A092D; --card:#2E3856; --card-2:#232B47; --ink:#F6F7FB; --muted:#B7BFD8; --rule:#45507A; --margin:#A8B1FF;
  --accent:#4255FF; --accent-hover:#5A6BFF; --accent-soft:#252F6B; --link:#A8B1FF; --on-accent:#FFFFFF; --line:#45507A;
  --go:#3FDCA0; --go-bg:#173F3A; --bad:#FF7B7F; --bad-bg:#4A2333; --ai:#B9A2FF; --ai-soft:#2E2A63;
  --shadow:0 4px 16px rgba(0,0,0,.3); --shadow-lg:0 8px 28px rgba(0,0,0,.45);
  --board:#1A1D4A; --board-2:#2E3856;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2;font-weight:800}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-variant-numeric:tabular-nums}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--rule)}
header.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px}
.logo{display:flex;align-items:center;gap:8px;background:none;border:0;cursor:pointer;padding:0;flex:none}
.logo-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:#FFFFFF;font-weight:800;font-size:17px}
.logo-text{font-size:21px;font-weight:800;letter-spacing:-.02em;color:var(--link)}
.search{flex:1;max-width:460px;position:relative}
.search input[type=text]{background:var(--card-2);border-color:transparent;border-radius:999px;padding:9px 16px 9px 40px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.top-actions{display:flex;gap:8px;align-items:center;margin-left:auto}
@media (max-width:640px){.search{display:none}}
@media (max-width:420px){.logo-text{font-size:18px}#newTop{display:none}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:15px;padding:10px 18px;border-radius:8px;border:2px solid var(--rule);background:var(--card);color:var(--ink);cursor:pointer;transition:background .12s,border-color .12s,transform .06s;text-decoration:none;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover:not(:disabled){background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ai{background:#6E44F5;border-color:#6E44F5;color:#FFFFFF}
.btn.ai:hover:not(:disabled){filter:brightness(1.1);border-color:#6E44F5}
.btn.good{background:var(--go-bg);color:var(--go);border-color:var(--go)}
.btn.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.btn.sm{font-size:14px;padding:6px 12px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--card-2);border-color:transparent}
.linkbtn{background:none;border:0;color:var(--link);font-weight:700;cursor:pointer;padding:4px 0}
.linkbtn:hover{text-decoration:underline;text-underline-offset:3px}
kbd{font-family:var(--f-body);font-size:11px;border:1px solid currentColor;border-radius:4px;padding:0 5px;opacity:.7}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--link)}
.chip.ai{background:var(--ai-soft);color:var(--ai)}
.spark{display:inline-block;width:16px;height:16px;flex:none}

/* plain card (class kept as .ruled) */
.ruled{background:var(--card);border-radius:8px;box-shadow:var(--shadow);border:0}

main{padding-block:28px 64px}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center;margin-bottom:40px;background:var(--card);border-radius:16px;padding:32px;box-shadow:var(--shadow)}
.hero h1{font-size:clamp(28px,4.4vw,42px);letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:var(--link)}
.hero p{color:var(--muted);font-size:18px;max-width:52ch;margin-block:12px 22px}
.hero-art{position:relative;height:210px}
.hero-art .ruled{position:absolute;width:64%;height:132px;padding:14px 18px;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);border:1px solid var(--rule)}
.hero-art .c1{left:2%;top:6px;transform:rotate(-5deg)}
.hero-art .c2{right:2%;top:58px;transform:rotate(4deg)}
.hero-art .ruled .lbl{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.hero-art .ruled .big{font-size:24px;font-weight:800;margin-top:auto}
.hero-art .mini-blocks{position:absolute;left:30%;bottom:-4px;display:grid;grid-template-columns:repeat(3,22px);gap:3px;transform:rotate(-3deg)}
.mini-blocks i{display:block;width:22px;height:22px;border-radius:5px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2),inset 0 2px 0 rgba(255,255,255,.35)}
@media (max-width:720px){.hero{grid-template-columns:1fr;padding:22px}.hero-art{display:none}}

.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.sec-title{font-size:15px;font-weight:700;color:var(--ink)}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.set-tile{text-align:left;cursor:pointer;padding:18px 20px;display:flex;flex-direction:column;gap:6px;min-height:150px;border-bottom:4px solid transparent;transition:border-color .12s,box-shadow .12s}
.set-tile:hover{border-bottom-color:var(--accent);box-shadow:var(--shadow-lg)}
.set-tile .st-meta{font-size:13px;color:var(--muted);font-weight:600;display:flex;gap:8px;align-items:center}
.set-tile .st-meta .pill{background:var(--card-2);border-radius:999px;padding:1px 10px;color:var(--ink)}
.set-tile .st-title{font-size:18px;font-weight:800;line-height:1.3}
.set-tile .st-peek{color:var(--muted);font-size:14px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;margin-top:auto}
.set-new{border:2px dashed var(--rule);border-radius:8px;background:transparent;cursor:pointer;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-weight:700}
.set-new:hover{border-color:var(--accent);color:var(--link)}
.set-new span{font-size:30px;line-height:1;color:var(--link)}

/* set page */
.crumb{display:flex;align-items:center;gap:8px;margin-bottom:14px;color:var(--muted);font-size:14px;flex-wrap:wrap}
.set-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:22px}
.set-head h1{font-size:clamp(26px,4vw,34px);letter-spacing:-.02em}
.set-head .desc{color:var(--muted);margin-top:6px;max-width:60ch}
.seg{display:inline-flex;border-radius:999px;overflow:hidden;background:var(--card-2);padding:3px}
.seg button{border:0;background:transparent;padding:6px 14px;font-weight:700;font-size:14px;cursor:pointer;color:var(--muted);border-radius:999px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(46,56,86,.18)}
.answer-with{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted);font-weight:700}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
@media (max-width:860px){.modes{grid-template-columns:repeat(2,1fr)}}
@media (max-width:420px){.modes{grid-template-columns:1fr}}
.mode{text-align:left;cursor:pointer;padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-height:140px;background:var(--card);border-radius:8px;box-shadow:var(--shadow);border:0;border-bottom:4px solid transparent;transition:border-color .12s,box-shadow .12s}
.mode:hover:not(:disabled){border-bottom-color:var(--accent);box-shadow:var(--shadow-lg)}
.mode:disabled{opacity:.45;cursor:not-allowed}
.mode svg{width:30px;height:30px;flex:none}
.mode .m-name{font-weight:800;font-size:17px}
.mode .m-desc{font-size:14px;color:var(--muted);line-height:1.4}
.mode.study svg{color:var(--link)}
.mode.game{position:relative}
.mode.game .hs{font-size:12px;color:var(--b2);font-weight:800;margin-top:auto}
.mode .ai-tag{position:absolute;top:12px;right:12px}
.group-label{display:flex;align-items:center;gap:10px;margin:28px 0 12px}
.group-label .sec-title{white-space:nowrap}
.terms{display:grid;gap:8px;margin-top:8px}
.term-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:20px;background:var(--card);border-radius:8px;padding:16px 20px;box-shadow:var(--shadow)}
.term-row .t{font-weight:600;border-right:2px solid var(--paper);padding-right:20px;overflow-wrap:anywhere}
.term-row .d{overflow-wrap:anywhere}
@media (max-width:520px){.term-row{grid-template-columns:1fr;gap:4px}.term-row .t{border-right:0;padding-right:0}}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bad-bg);color:var(--bad);padding:8px 12px;border-radius:10px;font-weight:700;font-size:14px}

/* editor */
.field{display:grid;gap:6px;margin-bottom:14px}
.field label,.lbl-sm{font-size:13px;font-weight:700;color:var(--muted)}
input[type=text],input:not([type]),textarea,select,input[type=number]{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--rule);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:110px}
.ed-rows{display:grid;gap:12px;margin-block:8px 14px}
.ed-row{display:grid;grid-template-columns:30px minmax(0,1fr) minmax(0,1.4fr) 36px;gap:12px;align-items:center;background:var(--card);border-radius:8px;padding:14px;box-shadow:var(--shadow)}
.ed-row .n{font-weight:700;color:var(--muted);text-align:center}
.ed-row input{border-width:0 0 2px;border-radius:0;padding-inline:2px;background:transparent}
.ed-row .del{background:none;border:0;cursor:pointer;color:var(--muted);font-size:20px;border-radius:8px;height:36px}
.ed-row .del:hover{color:var(--bad);background:var(--bad-bg)}
@media (max-width:600px){.ed-row{grid-template-columns:24px minmax(0,1fr) 32px}.ed-row .dd{grid-column:2/3}.ed-row .del{grid-row:1/3;grid-column:3}}
details.import{background:var(--card);border-radius:8px;padding:14px 18px;margin-bottom:18px;box-shadow:var(--shadow)}
details.import summary{cursor:pointer;font-weight:700}
.ai-box{background:var(--ai-soft);border-radius:12px;padding:18px;margin-bottom:18px;display:grid;gap:12px}
.ai-box h3{font-size:17px;display:flex;align-items:center;gap:8px;color:var(--ink)}
.ai-box p{color:var(--muted);font-size:14px}
.ai-box textarea{min-height:90px}
.ai-status{font-size:14px;font-weight:600;color:var(--ai);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ai-status:empty{display:none}
.ai-status.err{color:var(--bad)}
.dots::after{content:"";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.err{color:var(--bad);font-weight:700;margin-top:8px}
.sticky-save{position:sticky;bottom:0;background:var(--paper);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--rule);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}

/* mode bar */
.modebar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.modebar .mb-left{display:flex;align-items:center;gap:12px;min-width:0}
.modebar .mb-title{min-width:0}
.modebar .mb-mode{font-size:13px;font-weight:700;color:var(--link)}
.modebar .mb-set{font-weight:800;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--card);border-radius:8px;padding:4px 14px;text-align:center;min-width:70px;box-shadow:var(--shadow)}
.stat .k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block}
.stat .v{font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.game-stats .stat{background:var(--board);color:var(--board-ink)}
.game-stats .stat .k{color:var(--board-muted)}

/* flashcards */
.fc-wrap{max-width:760px;margin:0 auto;display:grid;gap:16px}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.fc-bar{height:4px;border-radius:4px;background:var(--rule);overflow:hidden}
.fc-bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.flip{perspective:1600px;cursor:pointer;border-radius:12px}
.flip-inner{position:relative;height:clamp(260px,46vh,380px);transition:transform .5s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.flip.flipped .flip-inner{transform:rotateX(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;padding:18px 28px;border-radius:12px!important;box-shadow:var(--shadow-lg)!important}
.face.back{transform:rotateX(180deg)}
.face-label{font-size:13px;font-weight:700;color:var(--muted)}
.face-text{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(24px,4vw,34px);font-weight:500;overflow-wrap:anywhere;overflow:auto}
.face-text.long{font-size:clamp(18px,2.6vw,23px)}
.hint{font-size:13px;color:var(--muted);text-align:center}
.fc-ctrl{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:10px}
.fc-ctrl .btn{border-radius:999px}
.fc-tally{display:flex;justify-content:center;gap:18px;color:var(--muted);font-weight:700;font-size:14px}
.fc-tally .g{color:var(--go)}.fc-tally .b{color:var(--b2)}
.btn.still{background:var(--card);color:var(--b2);border-color:var(--b2)}
@media (prefers-reduced-motion:reduce){.flip-inner{transition:none}}

/* questions */
.drill{max-width:800px;margin:0 auto;display:grid;gap:16px}
.progress{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--rule)}
.progress i{display:block;height:100%;transition:width .3s}
.progress .p-m{background:var(--go)}.progress .p-l{background:var(--b2)}
.prog-legend{display:flex;gap:16px;font-size:13px;color:var(--muted);font-weight:700;flex-wrap:wrap}
.prog-legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c)}
.panel{background:var(--card);border-radius:12px;padding:24px;box-shadow:var(--shadow);border:2px solid transparent}
.q-label{font-size:13px;font-weight:700;color:var(--muted);display:flex;justify-content:space-between;gap:10px}
.q-prompt{font-size:clamp(19px,2.8vw,24px);font-weight:500;margin-block:10px 22px;overflow-wrap:anywhere}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--rule);border-radius:8px;padding:14px 16px;cursor:pointer;font-size:16px;font-weight:500;min-height:58px;overflow-wrap:anywhere}
.opt:hover:not(:disabled){border-color:var(--muted)}
.opt .key{flex:none;width:24px;height:24px;border-radius:999px;background:var(--card-2);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--go);background:var(--go-bg);color:var(--ink)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--ink)}
.opt:disabled{cursor:default}
.wform{display:flex;gap:10px}
.wform input{flex:1}
.fb{margin-top:16px;border-radius:8px;padding:12px 16px;display:grid;gap:8px}
.fb:empty{display:none}
.fb.ok{background:var(--go-bg);color:var(--go)}
.fb.no{background:var(--bad-bg);color:var(--bad)}
.fb .ans{color:var(--ink);font-weight:700}
.fb .why{color:var(--ink);font-size:14px}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
.result{text-align:center;display:grid;gap:12px;justify-items:center;padding-block:10px}
.result .big{font-size:clamp(44px,8vw,64px);font-weight:800;line-height:1;letter-spacing:-.03em}
.missed{display:grid;gap:6px;width:100%;text-align:left;margin-top:6px}
.missed div{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:12px;padding:10px 14px;border-radius:8px;background:var(--paper);overflow-wrap:anywhere}
.missed b{color:var(--ink)}

/* test */
.test-q{display:grid;gap:4px}
.test-q .num{font-weight:800;color:var(--ink)}
.test-q.graded-ok{border-color:var(--go)}
.test-q.graded-no{border-color:var(--bad)}
.tf{display:flex;gap:12px}
.tf .opt{flex:1;justify-content:center}
.tf-shown{font-size:18px;margin-bottom:14px;padding:12px 16px;background:var(--card-2);border-radius:8px}
.checks{display:flex;gap:16px;flex-wrap:wrap}
.checks label{display:flex;gap:8px;align-items:center;font-weight:600;cursor:pointer}
.checks input{width:18px;height:18px;accent-color:var(--accent)}
.test-setup{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.test-setup .panel{display:grid;gap:16px;align-content:start}
.test-setup .panel.aip{border-color:var(--ai)}
.test-setup h2{font-size:21px;display:flex;align-items:center;gap:8px}
.test-setup p.sub{color:var(--muted);font-size:14px;margin-top:-8px}
.open-ans{min-height:90px}
.stream{font-size:13px;color:var(--muted);max-height:120px;overflow:hidden;white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;mask-image:linear-gradient(to bottom,transparent,#000 40%)}

/* game shell */
.game{background:var(--board);color:var(--board-ink);border-radius:16px;padding:18px}
.game .panel{background:var(--board-2);border-color:transparent;color:var(--board-ink);box-shadow:none}
.game .q-label{color:var(--board-muted)}
.game .opt{background:var(--board);border-color:var(--board-2);color:var(--board-ink)}
.game .opt .key{background:var(--board-2);color:var(--board-muted)}
.game .opt:hover:not(:disabled){border-color:var(--b5)}
.game .opt.right{border-color:var(--b4);background:color-mix(in srgb,var(--b4) 22%,var(--board));color:var(--board-ink)}
.game .opt.wrong{border-color:var(--b1);background:color-mix(in srgb,var(--b1) 22%,var(--board));color:var(--board-ink)}
.game .fb.ok{background:color-mix(in srgb,var(--b4) 20%,var(--board));color:var(--board-ink)}
.game .fb.no{background:color-mix(in srgb,var(--b1) 20%,var(--board));color:var(--board-ink)}
.game .fb .ans{color:var(--b3)}
.game h2{font-family:var(--f-display);font-weight:400;letter-spacing:.02em}
.game .muted{color:var(--board-muted)}
.splash{display:grid;gap:14px;justify-items:center;text-align:center;padding:28px 10px}
.splash h2{font-size:clamp(28px,6vw,44px)}
.splash p{color:var(--board-muted);max-width:46ch}
.splash .btn{font-size:17px;padding:12px 26px}
.splash .seg{background:var(--board-2)}
.splash .seg button{color:var(--board-muted)}
.splash .seg button[aria-pressed="true"]{background:var(--board-ink);color:var(--board)}
.missed-dark div{background:var(--board-2)}
.missed-dark b{color:var(--b3)}

/* block blast */
.bb{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:760px){.bb{grid-template-columns:1fr;justify-items:center}}
.bb-board{position:relative;width:100%;max-width:400px}
.bb-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;padding:6px;border-radius:12px;background:#05041C;aspect-ratio:1;width:100%;max-width:100%;touch-action:none}
.cell{border-radius:5px;background:rgba(255,255,255,.06);position:relative}
.cell.f,.pc i{background:var(--c);box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),inset 0 3px 0 rgba(255,255,255,.35)}
.cell.pv{background:var(--c);opacity:.45}
.cell.wc{box-shadow:0 0 0 2px #FFFFFF inset}
.cell.clr{animation:pop .32s forwards}
@keyframes pop{0%{transform:scale(1);filter:brightness(1.8)}100%{transform:scale(.2);opacity:0}}
.bb-side{display:grid;gap:14px;width:100%;min-width:0}
.tray{display:flex;justify-content:space-around;align-items:center;gap:10px;min-height:140px;background:var(--board-2);border-radius:12px;padding:14px}
.pc{display:grid;gap:2px;touch-action:none;cursor:grab;padding:6px;border-radius:8px;transition:transform .1s}
.pc i{display:block;width:var(--m);height:var(--m);border-radius:4px}
.pc.used{visibility:hidden}
.pc.sel{outline:3px solid var(--b3);outline-offset:2px}
.pc.nofit{opacity:.35}
.bb-drag{position:fixed;z-index:60;pointer-events:none;display:grid;filter:drop-shadow(0 8px 10px rgba(0,0,0,.35))}
.bb-drag i{display:block;border-radius:5px;background:var(--c);box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),inset 0 3px 0 rgba(255,255,255,.35)}
.over{position:absolute;inset:0;background:rgba(10,9,45,.9);border-radius:12px;display:grid;place-items:center;text-align:center;padding:16px;color:#F6F7FB}
.over .inner{display:grid;gap:10px;justify-items:center;max-height:100%;overflow:auto}
.over h3{font-family:var(--f-display);font-weight:400;font-size:28px}
.floaty{position:absolute;font-family:var(--f-display);font-size:24px;color:var(--b3);pointer-events:none;animation:floatup .9s forwards;text-shadow:0 2px 0 #05041C;z-index:5;left:50%;top:40%;transform:translateX(-50%)}
@keyframes floatup{to{transform:translate(-50%,-50px);opacity:0}}
.streak{color:var(--b3)}
.bb-help{font-size:14px;color:var(--board-muted)}

/* gravity */
.gv-arena{position:relative;height:clamp(340px,56vh,500px);overflow:hidden;border-radius:14px;background:radial-gradient(1px 1px at 20% 30%,rgba(255,255,255,.7),transparent),radial-gradient(1px 1px at 70% 20%,rgba(255,255,255,.6),transparent),radial-gradient(1.5px 1.5px at 40% 70%,rgba(255,255,255,.5),transparent),radial-gradient(1px 1px at 85% 60%,rgba(255,255,255,.6),transparent),radial-gradient(1px 1px at 10% 85%,rgba(255,255,255,.5),transparent),#05041C}
.gv-ground{position:absolute;left:0;right:0;bottom:0;height:16px;background:repeating-linear-gradient(-45deg,var(--b1) 0 10px,#7A1F2B 10px 20px)}
.gv-ground.hit{animation:flash .4s}
@keyframes flash{50%{filter:brightness(2.2)}}
.rock{position:absolute;top:0;max-width:min(62%,320px);padding:8px 14px;border-radius:16px 22px 18px 24px;background:#3A4378;color:#F6F7FB;font-weight:700;font-size:15px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.25),0 0 0 2px #59639F;will-change:transform;overflow-wrap:anywhere}
.rock::before{content:"";position:absolute;left:50%;bottom:100%;width:2px;height:40px;transform:translateX(-50%);background:linear-gradient(to top,rgba(255,180,70,.6),transparent)}
.rock.boom{animation:boom .35s forwards}
@keyframes boom{to{transform:var(--t) scale(1.6);opacity:0;background:var(--b3);color:#05041C}}
.gv-input{display:flex;gap:10px;margin-top:12px}
.gv-input input{background:var(--board-2);color:var(--board-ink);border-color:var(--board-2);font-size:18px}
.gv-input input:focus{border-color:var(--b5)}
.gv-note{min-height:24px;font-size:14px;color:var(--board-muted);margin-top:8px}
.gv-note b{color:var(--b3)}
.hearts{letter-spacing:4px;color:var(--b1)}

/* match + memory */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:620px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{min-height:96px;border-radius:10px;border:2px solid var(--board-2);background:var(--board-2);color:var(--board-ink);padding:10px;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;overflow-wrap:anywhere;transition:transform .12s,opacity .25s}
.tile:hover:not(:disabled){border-color:var(--b5)}
.tile.sel{border-color:var(--b5);background:color-mix(in srgb,var(--b5) 22%,var(--board-2))}
.tile.no{border-color:var(--b1);animation:shake .35s}
.tile.gone{opacity:0;transform:scale(.8);pointer-events:none}
.tile.long{font-size:13px;font-weight:500}
.mtile{perspective:900px;min-height:104px;background:none;border:0;padding:0;cursor:pointer}
.mtile .in{position:relative;width:100%;height:100%;min-height:104px;transition:transform .35s;transform-style:preserve-3d}
.mtile.up .in,.mtile.done .in{transform:rotateY(180deg)}
.mtile .fa{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;padding:8px;text-align:center;font-weight:700;font-size:14px;overflow-wrap:anywhere;overflow:hidden}
.mtile .fa.down{background:repeating-linear-gradient(45deg,var(--board-2) 0 8px,#36407A 8px 16px);border:2px solid #4255FF;font-family:var(--f-display);font-size:26px;color:var(--board-muted)}
.mtile .fa.face{background:#F6F7FB;color:#0A092D;transform:rotateY(180deg)}
.mtile.done .fa.face{background:var(--b4)}
.mtile .fa.face.long{font-size:12px;font-weight:500}
@media (prefers-reduced-motion:reduce){.mtile .in{transition:none}}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-weight:700;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px)}
#toast.on{opacity:1}
.empty{text-align:center;padding:30px;color:var(--muted)}

/* ---------- motion ---------- */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes popIn{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.05);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes shine{from{transform:translateX(-120%) skewX(-20deg)}to{transform:translateX(320%) skewX(-20deg)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(0,178,107,.45)}50%{box-shadow:0 0 0 10px rgba(0,178,107,0)}}
@keyframes fadeIn{from{opacity:0}}
.enter>*{animation:rise .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*55ms)}
.stagger>*{animation:rise .42s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*35ms + 90ms)}
.bump{display:inline-block;animation:bump .3s}
.btn{transition:background .12s,border-color .12s,transform .12s,box-shadow .12s}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.set-tile,.mode{transition:transform .18s,box-shadow .18s,border-color .18s}
.set-tile:hover,.mode:hover:not(:disabled){transform:translateY(-3px)}
.opt.right{animation:bump .3s}
.hero h1 em{display:inline-block;animation:bob 3s ease-in-out infinite}
.hero-art .c1{animation:rise .6s .1s both}.hero-art .c2{animation:rise .6s .25s both}
.mini-blocks i{animation:popIn .4s both}.mini-blocks i:nth-child(2){animation-delay:.1s}.mini-blocks i:nth-child(3){animation-delay:.2s}.mini-blocks i:nth-child(5){animation-delay:.3s}.mini-blocks i:nth-child(6){animation-delay:.4s}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:95}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.01ms!important}}

/* ---------- header tabs ---------- */
.tabs{display:flex;gap:2px}
.tabs button{border:0;background:none;padding:8px 12px;font-weight:700;font-size:15px;color:var(--muted);cursor:pointer;position:relative;border-radius:8px}
.tabs button:hover{color:var(--ink);background:var(--card-2)}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"]::after{content:"";position:absolute;left:12px;right:12px;bottom:-11px;height:3px;border-radius:3px;background:var(--accent);animation:grow .25s}
@keyframes grow{from{transform:scaleX(0)}}
@media (max-width:560px){.logo-text{display:none}header.top .wrap{gap:8px}.tabs button{padding:8px 9px}}

/* ---------- game thumbnails + hub ---------- */
.thumb{position:relative;display:grid;place-items:center;aspect-ratio:16/10;width:100%;max-width:100%;border-radius:12px;overflow:hidden;background:radial-gradient(circle at 18% 12%,rgba(255,255,255,.3),transparent 45%),linear-gradient(135deg,var(--g1),var(--g2))}
.thumb::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.16) 1.5px,transparent 1.7px);background-size:16px 16px}
.thumb::after{content:"";position:absolute;top:0;bottom:0;left:0;width:35%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:translateX(-120%) skewX(-20deg)}
.thumb svg{position:relative;width:36%;height:auto;max-height:72%;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25));transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.game-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:20px 18px}
.gcard{background:none;border:0;padding:0;text-align:left;cursor:pointer;display:grid;gap:8px;align-content:start;transition:transform .2s}
.gcard .thumb{box-shadow:var(--shadow);transition:box-shadow .2s}
.gcard:hover:not(:disabled){transform:translateY(-4px)}
.gcard:hover:not(:disabled) .thumb{box-shadow:var(--shadow-lg)}
.gcard:hover:not(:disabled) .thumb::after{animation:shine .9s}
.gcard:hover:not(:disabled) .thumb svg{transform:scale(1.14) rotate(-5deg)}
.gcard:disabled{opacity:.45;cursor:not-allowed}
.gcard .gname{font-weight:800;font-size:16px;line-height:1.25}
.gcard .gmeta{font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;font-weight:600}
.mini-games{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px 14px}
.mini-games .gname{font-size:14px}
.genre-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.genre-chips button{border:0;border-radius:999px;padding:7px 15px;font-weight:700;font-size:14px;background:var(--card);box-shadow:var(--shadow);cursor:pointer;color:var(--muted);transition:background .15s,color .15s}
.genre-chips button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.featured{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);border-radius:16px;overflow:hidden;background:var(--card);box-shadow:var(--shadow);margin-bottom:32px}
.featured .thumb{border-radius:0;aspect-ratio:auto;min-height:250px}
.featured .thumb svg{width:24%;animation:bob 3s ease-in-out infinite}
.featured .fi{padding:28px;display:grid;gap:12px;align-content:center;justify-items:start}
@media (max-width:720px){.featured{grid-template-columns:1fr}.featured .thumb{min-height:170px}}
.btn.play{background:#00A862;border-color:#00A862;color:#FFFFFF;animation:glow 2.4s infinite}
.btn.play:hover:not(:disabled){background:#00964F;border-color:#00964F}
.btn.play.big{font-size:20px;padding:14px 40px;border-radius:12px;justify-self:start}
.gd{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:800px){.gd{grid-template-columns:1fr}}
.gd>.thumb{border-radius:16px;box-shadow:var(--shadow-lg)}
.gd>.thumb svg{width:26%;animation:bob 3s ease-in-out infinite}
.gd-info{display:grid;gap:14px}
.gd-info h1{font-size:clamp(28px,4vw,40px);letter-spacing:-.02em}
.gd-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.gd-stats div{background:var(--card);border-radius:10px;padding:10px 8px;box-shadow:var(--shadow);text-align:center}
.gd-stats b{display:block;font-size:19px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.gd-stats span{font-size:12px;color:var(--muted);font-weight:700}
.gd-body{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:28px;margin-top:30px}
@media (max-width:800px){.gd-body{grid-template-columns:1fr}}
.gd-body h2{font-size:19px;margin-bottom:8px}
.gd-body p{max-width:65ch}
.gd-body ol{margin:0;padding-left:20px;display:grid;gap:6px}
.gd-body .ctl{color:var(--muted);font-size:14px;margin-top:12px}

/* ---------- deck picker ---------- */
.modal-back{position:fixed;inset:0;background:rgba(10,9,45,.55);z-index:70;display:grid;place-items:center;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));animation:fadeIn .2s}
.modal{background:var(--card);color:var(--ink);border-radius:16px;box-shadow:var(--shadow-lg);width:min(540px,100%);max-height:min(660px,90vh);display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden;animation:popIn .3s cubic-bezier(.2,.9,.3,1.2)}
.modal header{padding:20px 22px 10px}
.modal header p{color:var(--muted);font-size:14px}
.thumb.mini{width:56px;aspect-ratio:1;border-radius:12px;flex:none}
.thumb.mini svg{width:62%}
.deck-list{overflow:auto;padding:8px 16px 14px;display:grid;gap:8px;align-content:start}
.deck{display:flex;align-items:center;gap:12px;text-align:left;background:var(--paper);border:2px solid transparent;border-radius:10px;padding:12px 14px;cursor:pointer;transition:border-color .12s,transform .15s}
.deck:hover:not(:disabled),.deck:focus-visible{border-color:var(--accent);transform:translateX(4px)}
.deck:disabled{opacity:.5;cursor:not-allowed}
.dk-ic{width:40px;height:40px;border-radius:10px;background:var(--accent-soft);color:var(--link);display:grid;place-items:center;font-weight:800;flex:none}
.dk-t{font-weight:800}
.dk-m{font-size:13px;color:var(--muted)}
.deck .last{margin-left:auto;flex:none}
.modal footer{padding:12px 22px 18px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--rule)}

/* ---------- shared game bits ---------- */
.splash-icon.thumb{width:116px;aspect-ratio:1;border-radius:26px;animation:bob 3s ease-in-out infinite;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.splash-icon.thumb svg{width:60%}
.end-score{font-family:var(--f-display);font-size:clamp(44px,9vw,64px);color:var(--b3);line-height:1;animation:popIn .5s cubic-bezier(.2,.9,.3,1.3)}
.chip.new-best{background:var(--b3);color:#0A092D;animation:bump .5s .3s both}
.prompt-bar{background:var(--board-2);border-radius:12px;padding:12px 16px;margin-bottom:12px;display:grid;gap:2px;animation:popIn .3s}
.pq-l{font-size:12px;font-weight:700;color:var(--board-muted);text-transform:uppercase;letter-spacing:.06em}
.pq-t{font-size:clamp(17px,2.6vw,22px);font-weight:700;overflow-wrap:anywhere}
.cv-wrap{width:min(100%,460px);margin:0 auto}
.cv-wrap canvas,.cv-wide canvas{display:block;width:100%;border-radius:12px;touch-action:none}
.cv-wide{width:100%}
.legend{display:grid;gap:6px;margin:12px auto 0;max-width:460px}
.legend div{display:flex;gap:10px;align-items:center;background:var(--board-2);border-radius:8px;padding:8px 12px;overflow-wrap:anywhere;min-width:0}
.legend b{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#0A092D}
.dpad{display:none;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,50px);gap:6px;justify-content:center;margin-top:12px}
.dpad button{border:0;border-radius:12px;background:var(--board-2);color:var(--board-ink);font-size:18px;cursor:pointer}
.dpad button:active{background:var(--b5)}
.dpad [data-d=up]{grid-column:2}.dpad [data-d=left]{grid-column:1;grid-row:2}.dpad [data-d=down]{grid-column:2;grid-row:2}.dpad [data-d=right]{grid-column:3;grid-row:2}
@media (pointer:coarse){.dpad{display:grid}}
.gnote{min-height:24px;font-size:14px;color:var(--board-muted);margin-top:10px;text-align:center;overflow-wrap:anywhere}
.gnote b{color:var(--b3)}
.lr-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.lr-btns button{border:0;border-radius:12px;padding:14px;font-weight:800;background:var(--board-2);color:var(--board-ink);cursor:pointer;font-size:16px}
.lr-btns button:active{background:var(--b5);color:#0A092D}
.timebar{height:8px;background:var(--board-2);border-radius:8px;overflow:hidden;margin-bottom:12px}
.timebar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--b1),var(--b3),var(--b4));transition:width .1s linear}

/* whack */
.holes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:560px;margin:0 auto}
.hole{position:relative;aspect-ratio:1/.92;border-radius:16px;overflow:hidden;background:radial-gradient(ellipse 46% 13% at 50% 90%,#05041C 98%,transparent 100%),linear-gradient(#3B8F4E,#2C6E3C)}
.mole{position:absolute;left:10%;right:10%;bottom:8%;height:88%;border:0;background:none;padding:0;cursor:pointer;transform:translateY(110%);transition:transform .2s cubic-bezier(.3,1.5,.5,1);display:flex;flex-direction:column;align-items:center}
.mole.up{transform:translateY(0)}
.mole-lbl{position:relative;z-index:1;background:#F6F7FB;color:#0A092D;font-weight:700;font-size:12px;line-height:1.2;padding:5px 7px;border-radius:8px;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow-wrap:anywhere;box-shadow:0 3px 0 rgba(0,0,0,.25);margin-bottom:-2px}
.mole-face{flex:1;width:76%;min-height:30px;border-radius:50% 50% 14% 14%/62% 62% 14% 14%;background:radial-gradient(circle at 35% 36%,#0A092D 0 5%,transparent 6%),radial-gradient(circle at 65% 36%,#0A092D 0 5%,transparent 6%),radial-gradient(ellipse at 50% 52%,#FF9AA8 0 9%,transparent 10%),#9A6644;box-shadow:inset 0 -10px 0 rgba(0,0,0,.18)}
.mole.hit{animation:bonk .3s}
.mole.hit .mole-lbl{background:var(--b4)}
.mole.miss .mole-lbl{background:var(--b1);color:#FFFFFF}
@keyframes bonk{40%{transform:translateY(12%) scaleY(.82)}}
@media (max-width:480px){.mole-lbl{font-size:10.5px;padding:4px 5px}}

/* balloon */
.sky{position:relative;height:clamp(380px,60vh,540px);overflow:hidden;border-radius:14px;background:linear-gradient(#2A3FA8,#6C8CFF 70%,#9FD3FF)}
.cloud{position:absolute;width:140px;height:40px;border-radius:40px;background:rgba(255,255,255,.35);animation:drift 30s linear infinite}
.cloud.c1{top:18%;left:-20%}.cloud.c2{top:55%;left:-30%;animation-duration:44s;animation-delay:-14s}
@keyframes drift{to{transform:translateX(140vw)}}
.balloon{position:absolute;top:0;left:0;width:128px;height:150px;border:0;padding:0;background:none;cursor:pointer;will-change:transform}
.balloon .bb-body{position:absolute;inset:0 0 20px;border-radius:50% 50% 48% 48%/56% 56% 44% 44%;background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.6),transparent 28%),var(--c);display:grid;place-items:center;padding:16px 12px;box-shadow:inset -8px -10px 0 rgba(0,0,0,.12);transition:transform .15s}
.balloon:hover .bb-body{transform:scale(1.05)}
.balloon .bb-body span{font-weight:700;font-size:13px;line-height:1.2;color:#0A092D;text-align:center;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.balloon::after{content:"";position:absolute;left:50%;bottom:0;width:2px;height:22px;background:rgba(255,255,255,.75)}
.balloon.pop .bb-body{animation:balloonPop .26s forwards}
.balloon.pop::after{opacity:0}
@keyframes balloonPop{to{transform:scale(1.6);opacity:0}}
.balloon.away{opacity:0;transition:opacity .35s}

/* lightning */
.lt-stage{min-height:236px;display:grid;overflow:hidden}
.lt-card{background:var(--board-2);border-radius:16px;padding:26px 22px;min-height:220px;display:grid;gap:10px;align-content:center;text-align:center;touch-action:pan-y;user-select:none;cursor:grab;animation:popIn .25s}
.lt-p{font-size:clamp(20px,3vw,26px);font-weight:800;overflow-wrap:anywhere}
.lt-s{font-size:19px;color:var(--b3);font-weight:800;overflow-wrap:anywhere}
.lt-card.good{box-shadow:0 0 0 3px var(--b4)}.lt-card.badc{box-shadow:0 0 0 3px var(--b1)}
.lt-card.fly-l{animation:flyL .32s forwards}.lt-card.fly-r{animation:flyR .32s forwards}
@keyframes flyL{to{transform:translateX(-130%) rotate(-14deg);opacity:0}}
@keyframes flyR{to{transform:translateX(130%) rotate(14deg);opacity:0}}
.tfb{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.tfb button{border:0;border-radius:12px;padding:16px;font-weight:800;font-size:18px;cursor:pointer;color:#0A092D;box-shadow:0 4px 0 rgba(0,0,0,.3);transition:transform .08s}
.tfb button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.tfb .f{background:var(--b1)}.tfb .t{background:var(--b4)}

/* word rocket */
.rk{display:grid;grid-template-columns:120px minmax(0,1fr);gap:20px;align-items:center}
@media (max-width:560px){.rk{grid-template-columns:1fr}.rk-pad{height:150px!important}}
.rk-pad{position:relative;height:230px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;border-radius:12px;background:linear-gradient(#05041C,#1A1D4A)}
.rk-ship{width:54px;transition:transform 1.4s cubic-bezier(.55,0,.85,.35)}
.rk-ship .flame{opacity:0;transform-origin:30px 66px}
.rk-ship.launch{transform:translateY(-320px)}
.rk-ship.launch .flame{opacity:1;animation:flick .08s infinite alternate}
@keyframes flick{to{transform:scaleY(1.3)}}
.rk-ship.fizzle{transform:rotate(22deg) translate(6px,8px);transition:transform .6s}
.rk-ground{width:86px;height:6px;border-radius:4px;background:#59639F}
.fuel{display:flex;gap:4px;margin-bottom:10px}
.fuel i{width:11px;height:18px;border-radius:3px;background:var(--b4);transition:background .3s,transform .3s}
.fuel i.off{background:var(--board-2);transform:scaleY(.6)}
.slots{display:flex;flex-wrap:wrap;gap:8px 16px;margin-block:14px}
.slots .w{display:flex;gap:4px}
.slot{width:26px;height:36px;border-bottom:3px solid var(--board-muted);display:grid;place-items:center;font-size:21px;font-weight:800;text-transform:uppercase}
.slot.plain{border-color:transparent}
.slot.rev{animation:popIn .25s;border-color:var(--b4)}
.slot.lost{color:var(--b1)}
.kb{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:5px}
@media (max-width:620px){.kb{grid-template-columns:repeat(9,minmax(0,1fr))}}
.kb button{border:0;border-radius:6px;padding:9px 0;font-weight:800;background:var(--board-2);color:var(--board-ink);cursor:pointer;transition:transform .1s}
.kb button:hover:not(:disabled){transform:translateY(-2px)}
.kb button.hit{background:var(--b4);color:#0A092D}
.kb button.no{background:transparent;color:var(--board-muted);opacity:.45}

/* scramble */
.sc-ans{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;min-height:52px;margin-block:18px}
.sc-ans .w{display:flex;gap:5px}
.sc-slot,.sc-tile{width:40px;height:46px;border-radius:8px;display:grid;place-items:center;font-size:20px;font-weight:800;text-transform:uppercase;padding:0}
.sc-slot{border:2px dashed var(--board-muted);background:transparent;color:var(--board-ink)}
.sc-slot.f{border-style:solid;border-color:var(--b5);background:var(--board-2);cursor:pointer;animation:popIn .18s}
.sc-ans.win .sc-slot{border-color:var(--b4);background:color-mix(in srgb,var(--b4) 35%,var(--board-2));animation:bump .3s}
.sc-tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.sc-tile{border:0;background:#F6F7FB;color:#0A092D;cursor:pointer;box-shadow:0 4px 0 #A6AECB;transition:transform .1s}
.sc-tile:hover{transform:translateY(-3px)}
.sc-tile.used{visibility:hidden}
@media (max-width:480px){.sc-slot,.sc-tile{width:31px;height:40px;font-size:17px}}

/* tic-tac-know */
.ttt-wrap{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:760px){.ttt-wrap{grid-template-columns:1fr}}
.ttt{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:8px;aspect-ratio:1;width:100%;max-width:340px;margin:0 auto}
.ttt button{border:0;border-radius:12px;background:var(--board-2);font-family:var(--f-display);font-size:clamp(34px,8vw,52px);cursor:pointer;color:var(--board-ink);transition:background .15s,transform .15s}
.ttt button:hover:not(:disabled){background:#3A4570;transform:scale(1.03)}
.ttt button:disabled{cursor:default}
.ttt button.x{color:var(--b5)}.ttt button.o{color:var(--b1)}
.ttt button span{display:inline-block;animation:popIn .35s}
.ttt button.win{background:color-mix(in srgb,var(--b3) 40%,var(--board-2));animation:bump .4s}
.ttt button.pending{outline:3px solid var(--b3);outline-offset:-3px}
.tt-msg{font-size:16px;line-height:1.5}
.xo{font-family:var(--f-display)}.xo.x{color:var(--b5)}

/* set page games strip + library strip */
.pdf-btn svg{width:16px;height:16px}

/* ---------- game feel ---------- */
.fx-pop{position:fixed;z-index:96;pointer-events:none;font-family:var(--f-display);font-size:26px;transform:translate(-50%,-50%);text-shadow:0 2px 0 rgba(0,0,0,.45);animation:fxUp .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes fxUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}
.hard-shake{animation:hardShake .4s}
@keyframes hardShake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
.cd{display:grid;place-items:center;min-height:320px}
.cd span{font-family:var(--f-display);font-size:clamp(90px,18vw,140px);line-height:1;color:var(--board-ink);animation:cdPop .55s cubic-bezier(.2,.9,.3,1.3) both;text-shadow:0 6px 0 rgba(0,0,0,.35)}
.cd .go{color:var(--b4)}
@keyframes cdPop{0%{transform:scale(2.2);opacity:0}60%{transform:scale(.92);opacity:1}100%{transform:scale(1)}}
.stars{display:flex;gap:6px;justify-content:center}
.stars svg{width:46px;height:46px;fill:var(--board-2);animation:popIn .45s cubic-bezier(.2,.9,.3,1.4) both;animation-delay:var(--d)}
.stars svg.on{fill:var(--b3);filter:drop-shadow(0 0 10px rgba(255,205,31,.55))}
.stars svg:nth-child(2){width:58px;height:58px;margin-top:-8px}
.end-grid{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.end-grid div{background:var(--board-2);border-radius:10px;padding:8px 16px;min-width:96px}
.end-grid b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.end-grid span{font-size:12px;color:var(--board-muted);font-weight:700}
.missed .mh{display:flex;align-items:center;gap:12px}
.muted2{color:var(--muted);font-size:14px;font-weight:600}
/* quiz engine */
.qz-dots{display:flex;gap:5px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}
.qz-dots i{width:10px;height:10px;border-radius:50%;background:var(--board-2);transition:background .2s}
.qz-dots i.ok{background:var(--b4)}.qz-dots i.no{background:var(--b1)}.qz-dots i.cur{background:var(--board-ink);transform:scale(1.25)}
.qz-prompt{display:grid;gap:6px;justify-items:center;text-align:center;margin-block:8px 18px;animation:popIn .3s}
.qz-big{font-size:clamp(22px,3.6vw,30px);font-weight:800;overflow-wrap:anywhere}
.qz-flag .flag{width:min(300px,70vw);height:auto;aspect-ratio:3/2}
.qz-row{display:flex;gap:16px;align-items:center;text-align:left}
.qz-row>div{display:grid;gap:2px}
.qz-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.qz-opts{grid-template-columns:1fr}}
.qz-opts.flags{grid-template-columns:repeat(2,minmax(0,1fr))}
.qz-opt{display:flex;gap:12px;align-items:center;text-align:left;background:var(--board);border:2px solid var(--board-2);color:var(--board-ink);border-radius:12px;padding:14px 16px;min-height:60px;cursor:pointer;font-size:16px;font-weight:600;transition:transform .12s,border-color .12s,background .12s;overflow-wrap:anywhere}
.qz-opt:hover:not(:disabled){border-color:var(--b5);transform:translateY(-2px)}
.qz-opt .key{flex:none;width:26px;height:26px;border-radius:50%;background:var(--board-2);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--board-muted)}
.qz-opt .qz-o{min-width:0;flex:1}
.qz-opts.flags .qz-opt{padding:10px;justify-content:center}
.qz-opts.flags .flag{width:100%;height:auto;aspect-ratio:3/2;max-height:120px}
.qz-opt.right{border-color:var(--b4);background:color-mix(in srgb,var(--b4) 25%,var(--board));animation:bump .35s}
.qz-opt.wrong{border-color:var(--b1);background:color-mix(in srgb,var(--b1) 25%,var(--board))}
.qz-opt:disabled{cursor:default}
.flag{display:block;border-radius:6px;box-shadow:0 0 0 1px rgba(255,255,255,.15),0 8px 18px rgba(0,0,0,.35)}
.flag.sm{width:84px;height:56px;flex:none}
.flag.mini{width:42px;height:28px;flex:none;border-radius:4px}
.flag-parade{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;max-width:420px}
.flag-parade .flag{width:52px;height:35px;animation:bob 2.6s ease-in-out infinite}
.flag-parade .flag:nth-child(2n){animation-delay:-.6s}.flag-parade .flag:nth-child(3n){animation-delay:-1.2s}
.emoji-q{font-size:clamp(48px,10vw,76px);line-height:1.2;letter-spacing:6px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.genre-chips.dark{justify-content:center;max-width:620px}
.genre-chips.dark button{background:var(--board-2);color:var(--board-muted);box-shadow:none;display:inline-flex;align-items:center;gap:4px}
.genre-chips.dark button[aria-pressed="true"]{background:var(--board-ink);color:var(--board)}
.ai-setup input{background:var(--board-2);border-color:var(--board-2);color:var(--board-ink)}
/* higher or lower */
.hl-q{text-align:center;font-size:18px;margin-bottom:16px}
.hl{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:14px;align-items:center}
.hl-card{background:var(--board-2);border-radius:16px;padding:18px;display:grid;gap:10px;justify-items:center;text-align:center;border:3px solid transparent;animation:popIn .35s;transition:border-color .2s}
.hl-card .flag{width:min(180px,100%);height:auto;aspect-ratio:3/2}
.hl-card.ok{border-color:var(--b4)}.hl-card.no{border-color:var(--b1)}
.hl-name{font-weight:800;font-size:clamp(17px,2.4vw,22px);overflow-wrap:anywhere}
.hl-pop{color:var(--board-muted)}.hl-pop b{color:var(--b3);font-size:18px}
.hl-vs{font-family:var(--f-display);font-size:24px;color:var(--b3)}
@media (max-width:520px){.hl{grid-template-columns:1fr}.hl-vs{text-align:center}}
.hl-btns{max-width:480px;margin:16px auto 0}
/* math sprint */
.ms-q{text-align:center;font-family:var(--f-display);font-size:clamp(48px,10vw,80px);margin-block:20px 10px}
.ms-q.pop span{display:inline-block;animation:popIn .3s}
.ms-form{display:flex;justify-content:center}
.ms-form input{max-width:240px;text-align:center;font-size:32px;font-weight:800;background:var(--board-2);border-color:var(--board-2);color:var(--board-ink)}
.ms-form input:focus{border-color:var(--b5)}
/* daily */
.daily-banner{display:flex;align-items:center;gap:16px;width:100%;text-align:left;border:0;cursor:pointer;border-radius:16px;padding:16px 20px;color:#FFFFFF;background:linear-gradient(120deg,#FF8A3D,#FF5D6C 55%,#8F7BFF);box-shadow:var(--shadow);margin-top:6px;transition:transform .2s,box-shadow .2s;position:relative;overflow:hidden}
.daily-banner::after{content:"";position:absolute;top:0;bottom:0;left:0;width:30%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);transform:translateX(-120%) skewX(-20deg);animation:shine 3.5s 1s infinite}
.daily-banner:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.db-ic{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none}
.db-ic svg{width:32px;height:32px;animation:bob 2s ease-in-out infinite}
.db-t{display:grid;flex:1;min-width:0}.db-t b{font-size:18px}.db-t span{opacity:.95;font-size:14px}
.db-streak{font-family:var(--f-display);font-size:30px;line-height:1;text-align:center;flex:none}
.db-streak small{display:block;font-family:var(--f-body);font-size:12px;font-weight:700}
.daily-hero{display:flex;justify-content:space-between;gap:20px;align-items:center;flex-wrap:wrap;background:var(--card);border-radius:16px;padding:26px;box-shadow:var(--shadow)}
.daily-hero h1{font-size:clamp(30px,5vw,44px);margin-block:8px}
.daily-hero p{color:var(--muted);max-width:56ch}
.streak-big{display:grid;justify-items:center;background:linear-gradient(135deg,#FF8A3D,#FF5D6C);color:#FFFFFF;border-radius:18px;padding:14px 26px}
.streak-big svg{width:40px;height:40px;animation:bob 2s ease-in-out infinite}
.streak-big b{font-family:var(--f-display);font-size:44px;line-height:1}
.streak-big span{font-weight:700;font-size:13px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:16px}
.wkday{background:var(--card);border-radius:12px;padding:10px 4px;text-align:center;box-shadow:var(--shadow);display:grid;gap:4px}
.wkday span{font-size:12px;font-weight:700;color:var(--muted)}
.wkday i{font-style:normal;font-weight:800;font-size:14px;min-height:20px}
.wkday.on{background:var(--go-bg)}.wkday.on i{color:var(--go)}
.wkday.today{outline:2px solid var(--accent);outline-offset:-2px}
.daily-start{display:grid;gap:16px}
.daily-start h2{font-size:22px}
.muted2{color:var(--muted)}

/* ---------- daily row ---------- */
.daily-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
.daily-row.one{grid-template-columns:1fr}
@media (max-width:760px){.daily-row{grid-template-columns:1fr}}
.daily-row .daily-banner{margin-top:0}
.daily-banner.puzzle{background:linear-gradient(120deg,#18AE79,#1BB0A0 45%,#4255FF)}

/* ---------- Daily Puzzle ---------- */
.pz-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.pz-head h1{font-size:clamp(26px,4vw,36px);margin-block:6px 4px;letter-spacing:-.02em}
.pz-cat{color:var(--link)}
.pz-clue,.pz-how{background:var(--card);border-radius:12px;padding:12px 16px;box-shadow:var(--shadow);margin-bottom:14px;animation:popIn .3s;max-width:560px;margin-inline:auto}
.pz-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:14px}
.pz-legend span{display:flex;align-items:center;gap:6px}
.pz-legend .t{width:30px;height:30px;font-size:15px;border:0}
.pz-board{display:grid;gap:7px;justify-content:center;margin-block:10px 20px}
.pz-row{display:grid;grid-template-columns:repeat(var(--L),min(58px,calc((100vw - 48px - (var(--L) - 1) * 7px) / var(--L))));gap:7px}
.t{aspect-ratio:1;display:grid;place-items:center;font-size:clamp(20px,4.5vw,30px);font-weight:800;text-transform:uppercase;border:2px solid var(--rule);border-radius:8px;background:var(--card);color:var(--ink);user-select:none}
.t.filled{border-color:var(--muted)}
.t.typed{animation:bump .12s}
.t.flip{animation:tileFlip .5s ease both}
@keyframes tileFlip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
.t.correct{background:#18AE79;border-color:#18AE79;color:#FFFFFF}
.t.present{background:#F5B800;border-color:#F5B800;color:#FFFFFF}
.t.absent{background:#787C99;border-color:#787C99;color:#FFFFFF}
.pz-row.win .t{animation:tileJump .5s ease both}
.pz-row.win .t:nth-child(2){animation-delay:.08s}.pz-row.win .t:nth-child(3){animation-delay:.16s}.pz-row.win .t:nth-child(4){animation-delay:.24s}.pz-row.win .t:nth-child(5){animation-delay:.32s}.pz-row.win .t:nth-child(6){animation-delay:.4s}.pz-row.win .t:nth-child(7){animation-delay:.48s}
@keyframes tileJump{40%{transform:translateY(-14px)}60%{transform:translateY(2px)}}
.pz-kb{display:grid;gap:7px;max-width:520px;margin:0 auto}
.kr{display:flex;gap:6px;justify-content:center}
.kr button{flex:1;max-width:44px;height:54px;border:0;border-radius:8px;background:var(--card-2);color:var(--ink);font-weight:800;font-size:15px;cursor:pointer;transition:transform .08s,background .2s}
.kr button:active{transform:scale(.94)}
.kr button.wide{max-width:70px;flex:1.5;font-size:13px}
.kr button.correct{background:#18AE79;color:#FFFFFF}.kr button.present{background:#F5B800;color:#FFFFFF}.kr button.absent{background:#787C99;color:#FFFFFF}
.pz-result{max-width:560px;margin:24px auto 0;background:var(--card);border-radius:16px;padding:24px;box-shadow:var(--shadow-lg);display:grid;gap:14px;text-align:center;animation:popIn .4s}
.pz-result h2{font-size:28px}
.pz-word{letter-spacing:.12em;color:var(--link)}
.pz-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pz-stats b{display:block;font-size:26px;font-variant-numeric:tabular-nums}.pz-stats span{font-size:12px;color:var(--muted);font-weight:700}
.pz-dist{display:grid;gap:4px;text-align:left}
.pz-dist div{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:700}
.pz-dist i{font-style:normal;background:var(--muted);color:#FFFFFF;border-radius:4px;padding:1px 8px;text-align:right;min-width:24px;transition:width .6s}
.pz-dist i.me{background:#18AE79}
.pz-ai{display:flex;gap:8px;flex-wrap:wrap}.pz-ai input{flex:1;min-width:200px}

/* ---------- Quiz Show ---------- */
.show{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:20px;align-items:start}
@media (max-width:760px){.show{grid-template-columns:1fr}.ladder{display:none!important}}
.show-main{display:grid;gap:16px}
.lifelines{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.life{border:2px solid rgba(255,205,31,.6);background:rgba(255,205,31,.12);color:#FFE17A;border-radius:999px;padding:7px 14px;font-weight:800;font-size:13px;cursor:pointer;transition:transform .12s,background .12s}
.life:hover:not(:disabled){background:rgba(255,205,31,.25);transform:translateY(-1px)}
.life:disabled{opacity:.3;text-decoration:line-through;cursor:not-allowed}
.show-q{background:linear-gradient(180deg,rgba(66,85,255,.35),rgba(66,85,255,.15));border:2px solid rgba(143,123,255,.6);border-radius:18px;padding:20px;text-align:center;display:grid;gap:8px;animation:popIn .35s}
.show-qt{font-size:clamp(19px,2.8vw,25px);font-weight:800;overflow-wrap:anywhere}
.show-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.show-opts{grid-template-columns:1fr}}
.show-opt{display:flex;gap:12px;align-items:center;text-align:left;padding:14px 16px;min-height:58px;cursor:pointer;font-size:16px;transition:transform .12s,border-color .12s,background .2s;overflow-wrap:anywhere}
.show-opt b{flex:none;color:#E8A600;font-weight:800}
.show-opt.locked{background:#FFE9A8!important;border-color:#F5B800!important;animation:pulseLock .5s infinite alternate}
@keyframes pulseLock{to{box-shadow:0 0 0 6px rgba(245,184,0,.35)}}
.show-opt.gone{opacity:0;pointer-events:none;transition:opacity .4s}
.poll{display:flex;gap:14px;justify-content:center;align-items:flex-end;height:120px;padding:10px;background:rgba(255,255,255,.06);border-radius:12px;animation:popIn .3s}
.poll div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;width:44px;height:100%}
.poll i{display:block;width:30px;min-height:2px;background:linear-gradient(#FFCD1F,#FF8A3D);border-radius:4px 4px 0 0;animation:growUp .6s ease both}
@keyframes growUp{from{height:0}}
.poll b{font-size:12px}.poll span{font-weight:800;color:var(--board-muted)}
.ladder{list-style:none;margin:0;padding:10px;display:grid;gap:2px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:14px}
.ladder li{display:flex;justify-content:space-between;padding:4px 10px;border-radius:8px;font-size:13px;color:var(--board-muted);font-variant-numeric:tabular-nums;transition:background .3s}
.ladder li.safe{color:#FFFFFF;font-weight:800}
.ladder li.done{color:#7FE3B8}
.ladder li.cur{background:#F5B800;color:#1B1464;font-weight:800;animation:bump .4s}

/* ---------- Term Bingo ---------- */
.bingo{display:grid;gap:16px;justify-items:center}
.caller{width:100%;max-width:640px;padding:16px 18px;text-align:center;display:grid;gap:6px}
.call{font-size:clamp(17px,2.6vw,22px);font-weight:800;overflow-wrap:anywhere}
.call.pop{animation:popIn .35s}
.bcard{width:min(520px,100%);background:#FFFFFF;border-radius:18px;padding:12px;box-shadow:0 8px 0 rgba(10,9,45,.35),0 20px 40px -12px rgba(0,0,0,.45)}
.bhead{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:6px;margin-bottom:6px}
.bhead span{text-align:center;font-weight:800;font-size:22px;color:#FFFFFF;border-radius:8px;padding:2px 0;background:#4255FF}
.bhead span:nth-child(2){background:#FF5D6C}.bhead span:nth-child(3){background:#18AE79}.bhead span:nth-child(4){background:#F5B800}
.bgrid{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:6px}
.bcell{position:relative;aspect-ratio:1;border:2px solid #EDEFF4;background:#F6F7FB;color:#282E3E;border-radius:10px;font-weight:700;font-size:clamp(11px,1.9vw,15px);padding:6px;cursor:pointer;overflow:hidden;overflow-wrap:anywhere;transition:transform .1s,border-color .1s}
.bcell.long{font-size:clamp(10px,1.5vw,12px)}
.bcell:hover:not(.daub){border-color:#4255FF;transform:scale(1.03)}
.bcell.daub::after{content:"";position:absolute;inset:12%;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.35),transparent 40%),rgba(255,93,108,.78);animation:daub .3s cubic-bezier(.2,.9,.3,1.4) both}
@keyframes daub{from{transform:scale(1.8);opacity:0}}
.bcell.line{border-color:#F5B800;background:#FFF4CC}
.bcell.line::after{background:rgba(245,184,0,.8)}

/* ---------- Word Search ---------- */
.ws{display:grid;grid-template-columns:minmax(0,520px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.ws{grid-template-columns:1fr}}
.ws-grid{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:3px;background:#FFFFFF;border-radius:16px;padding:10px;touch-action:none;user-select:none;box-shadow:0 8px 0 rgba(10,9,45,.35);aspect-ratio:1;width:100%;max-width:520px;margin:0 auto}
.ws-cell{display:grid;place-items:center;border-radius:50%;font-weight:800;font-size:clamp(13px,2.6vw,19px);color:#282E3E;cursor:pointer;transition:background .1s,transform .1s}
.ws-cell.f{background:var(--c);color:#0A092D;border-radius:8px}
.ws-cell.f.miss{background:#FDE8E8;color:#E0393E}
.ws-cell.sel{background:#4255FF;color:#FFFFFF;transform:scale(1.08)}
.ws-side{display:grid;gap:10px;align-content:start}
.ws-clues{margin:0;padding-left:22px;display:grid;gap:8px}
.ws-clues li{background:rgba(255,255,255,.07);border-radius:10px;padding:8px 12px;display:grid;gap:2px;font-size:14px;transition:background .3s}
.ws-t{font-weight:800;letter-spacing:.08em;color:var(--board-muted)}
.ws-clues li.done{background:color-mix(in srgb,var(--c,#23C483) 25%,transparent)}
.ws-clues li.done .ws-t{color:#FFFFFF;letter-spacing:0}
.ws-clues li.done .ws-d{opacity:.7}
.ws-clues li.missed .ws-t{color:#FF9AA4}

/* ---------- Type Race ---------- */
.track{display:grid;gap:8px;background:#2A2F45;border-radius:16px;padding:12px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.06)}
.lane{display:grid;grid-template-columns:90px 1fr;gap:10px;align-items:center}
.lname{font-size:12px;font-weight:800;color:#C9CEE6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lane.me .lname{color:#FFCD1F}
.lroad{position:relative;height:46px;border-radius:10px;background:repeating-linear-gradient(90deg,transparent 0 26px,rgba(255,255,255,.18) 26px 40px) center/100% 2px no-repeat,#3A4060}
.finish{position:absolute;right:0;top:0;bottom:0;width:14px;border-radius:0 10px 10px 0;background:conic-gradient(#FFFFFF 25%,#0A092D 0 50%,#FFFFFF 0 75%,#0A092D 0) 0 0/7px 7px}
.car{position:absolute;top:6px;left:0;width:58px;transition:left .45s cubic-bezier(.2,.9,.3,1.1);z-index:1}
.car svg{display:block;width:58px;height:auto;filter:drop-shadow(0 3px 2px rgba(0,0,0,.35))}
.car.boost svg{animation:boostFx .45s}
@keyframes boostFx{30%{transform:translateX(6px) skewX(-8deg)}}
.car.spin svg{animation:spinOut .8s}
@keyframes spinOut{50%{transform:rotate(200deg)}100%{transform:rotate(360deg)}}
.race-q{margin-top:14px;padding:16px;display:grid;gap:6px}
@media (max-width:520px){.lane{grid-template-columns:1fr}.lname{margin-bottom:-4px}}

/* ---------- quality pass: cleaner, Quizlet-like game look ---------- */
:root{--board:#141247;--board-2:#2C2A72;--board-ink:#F6F7FB;--board-muted:#B9BEE0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--board:#141247;--board-2:#2C2A72}}
:root[data-theme="dark"]{--board:#141247;--board-2:#2C2A72}
.game{position:relative;overflow:hidden;border-radius:22px;padding:22px;color:var(--board-ink);background:radial-gradient(900px 380px at 0% -20%,rgba(66,85,255,.55),transparent 60%),radial-gradient(700px 360px at 110% 120%,rgba(255,115,195,.3),transparent 60%),linear-gradient(160deg,#18145E,#0D0B38);box-shadow:0 24px 60px -24px rgba(20,18,71,.6),inset 0 0 0 1px rgba(255,255,255,.07)}
.game::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.3px);background-size:22px 22px;pointer-events:none;-webkit-mask-image:linear-gradient(#000,transparent 85%);mask-image:linear-gradient(#000,transparent 85%)}
.game>*{position:relative}
.game .panel,.game .prompt-bar,.game .caller,.game .race-q{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:none;border-radius:16px}
.game h2,.splash h2,.over h3{font-family:var(--f-body);font-weight:800;letter-spacing:-.02em}
.end-score{font-family:var(--f-body);font-weight:800;letter-spacing:-.03em}
.splash{padding:34px 10px}
.splash p{font-size:16px}
.splash-icon.thumb{box-shadow:0 18px 40px -10px rgba(0,0,0,.6),0 0 0 6px rgba(255,255,255,.06)}
.game .opt,.qz-opt,.show-opt{background:#FFFFFF;color:#282E3E;border:2px solid transparent;box-shadow:0 4px 0 rgba(8,7,40,.4),0 10px 22px -10px rgba(0,0,0,.5);border-radius:12px;font-weight:600}
.game .opt .key,.qz-opt .key{background:#EDEFF4;color:#586380}
.game .opt:hover:not(:disabled),.qz-opt:hover:not(:disabled),.show-opt:hover:not(:disabled){border-color:#4255FF;transform:translateY(-2px)}
.game .opt:active:not(:disabled),.qz-opt:active:not(:disabled),.show-opt:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 rgba(8,7,40,.4)}
.game .opt.right,.qz-opt.right,.show-opt.right{background:#E2F7EF;border-color:#18AE79;color:#0E5C40}
.game .opt.wrong,.qz-opt.wrong,.show-opt.wrong{background:#FDE8E8;border-color:#E0393E;color:#8A1C1F}
.game .opt:disabled,.qz-opt:disabled,.show-opt:disabled{opacity:1}
.game .fb.ok{background:rgba(35,196,131,.16);color:#FFFFFF;border:1px solid rgba(35,196,131,.45)}
.game .fb.no{background:rgba(255,93,108,.14);color:#FFFFFF;border:1px solid rgba(255,93,108,.45)}
.game .fb .why{color:#DDE1F5}
.tile{background:#FFFFFF;color:#282E3E;border-color:transparent;box-shadow:0 4px 0 rgba(8,7,40,.4)}
.tile:hover:not(:disabled){border-color:#4255FF;transform:translateY(-2px)}
.tile.sel{border-color:#4255FF;background:#E8EBFF}
.tile.no{border-color:#E0393E;background:#FDE8E8}
.mtile .fa.down{background:linear-gradient(135deg,#4255FF,#8F7BFF);border:0;color:rgba(255,255,255,.9);box-shadow:0 4px 0 rgba(8,7,40,.4)}
.mtile .fa.face{background:#FFFFFF;color:#282E3E;box-shadow:0 4px 0 rgba(8,7,40,.4)}
.mtile.done .fa.face{background:#E2F7EF;color:#0E5C40}
.lt-card{background:#FFFFFF;color:#282E3E;box-shadow:0 6px 0 rgba(8,7,40,.4),0 20px 40px -14px rgba(0,0,0,.5)}
.lt-card .pq-l{color:#586380}.lt-s{color:#4255FF}
.hl-card{background:#FFFFFF;color:#282E3E;box-shadow:0 6px 0 rgba(8,7,40,.4)}
.hl-pop{color:#586380}.hl-pop b{color:#4255FF}
.timebar{height:6px;background:rgba(255,255,255,.12)}
.qz-dots i{background:rgba(255,255,255,.18)}
.tray,.legend div,.end-grid div,.missed-dark div{background:rgba(255,255,255,.08)}
.kb button{background:rgba(255,255,255,.1)}
.game-stats .stat{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.game-stats .stat .k{color:var(--muted)}
.game-stats .stat .v{color:var(--link)}
.qz-prompt .flag{box-shadow:0 0 0 1px rgba(255,255,255,.2),0 14px 30px -8px rgba(0,0,0,.55)}

/* ---------- beta gate ---------- */
body.locked .tabs,body.locked .search,body.locked .top-actions{display:none}
.gate{position:relative;min-height:calc(100vh - 160px);display:grid;place-items:center;padding-block:20px}
.gate-bg{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.gb{position:absolute;background:var(--card);border-radius:12px;padding:16px 22px;font-weight:800;font-size:18px;box-shadow:var(--shadow-lg);color:var(--ink);opacity:.9;animation:bob 5s ease-in-out infinite}
.gb.g1{left:4%;top:10%;transform:rotate(-8deg)}.gb.g2{right:5%;top:18%;animation-delay:-1.5s}.gb.g3{left:10%;bottom:12%;animation-delay:-3s}
.gk{position:absolute;width:30px;height:30px;border-radius:7px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2),inset 0 3px 0 rgba(255,255,255,.35);animation:bob 4s ease-in-out infinite}
.gk.k1{right:12%;bottom:18%;background:var(--b1)}.gk.k2{right:calc(12% + 34px);bottom:18%;background:var(--b3);animation-delay:-1s}.gk.k3{right:12%;bottom:calc(18% + 34px);background:var(--b5);animation-delay:-2s}.gk.k4{left:44%;top:6%;background:var(--b4);animation-delay:-.5s}
@media (max-width:760px){.gb,.gk{display:none}}
.gate-card{position:relative;width:min(440px,100%);background:var(--card);border-radius:20px;padding:32px 28px;box-shadow:var(--shadow-lg);display:grid;gap:12px;justify-items:center;text-align:center;animation:popIn .45s cubic-bezier(.2,.9,.3,1.2)}
.gate-card h1{font-size:28px;letter-spacing:-.02em}
.gate-card p{color:var(--muted)}
.gate-card .lbl-sm{justify-self:start}
.gate-card input{font-size:20px;text-align:center;letter-spacing:.16em;font-weight:800;text-transform:uppercase}
.gate-card input::placeholder{letter-spacing:normal;text-transform:none;font-weight:500}
.gate-card .err{margin:0;min-height:22px}
.gate-card.ok{animation:bump .4s}
.logo-mark.big{width:56px;height:56px;border-radius:14px;font-size:30px}
.big-btn{width:100%;padding:13px;font-size:17px}
.gate-note{font-size:13px}
.chip.beta{background:#FFE9A8;color:#7A5300}

/* ---------- home ---------- */
.home-hero{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:center;border-radius:22px;padding:34px;color:#FFFFFF;background:radial-gradient(600px 300px at 90% 0%,rgba(255,115,195,.45),transparent 60%),radial-gradient(500px 300px at 0% 110%,rgba(35,196,131,.35),transparent 60%),linear-gradient(135deg,#4255FF,#5A3BD8);box-shadow:0 24px 50px -24px rgba(66,85,255,.7)}
.home-hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.14) 1.2px,transparent 1.4px);background-size:20px 20px;-webkit-mask-image:linear-gradient(90deg,#000,transparent 70%);mask-image:linear-gradient(90deg,#000,transparent 70%);pointer-events:none}
.hh-text{position:relative;display:grid;gap:12px;justify-items:start}
.hh-text h1{font-size:clamp(28px,4.4vw,42px);letter-spacing:-.025em}
.hh-text p{opacity:.92;font-size:17px;max-width:46ch}
.btn.light{background:#FFFFFF;border-color:#FFFFFF;color:#2B37C2}
.btn.light:hover:not(:disabled){background:#EEF0FF;border-color:#EEF0FF}
.btn.ghost-light{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.35);color:#FFFFFF}
.btn.ghost-light:hover:not(:disabled){background:rgba(255,255,255,.24);border-color:rgba(255,255,255,.5)}
.hh-art{position:relative;height:220px}
.fc{position:absolute;background:#FFFFFF;color:#282E3E;border-radius:14px;padding:14px 18px;display:grid;gap:4px;box-shadow:0 18px 34px -12px rgba(10,9,45,.55);animation:bob 4.5s ease-in-out infinite}
.fc span{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:#586380}
.fc b{font-size:22px}
.fc.f1{left:2%;top:8px;transform:rotate(-6deg);width:52%}
.fc.f2{right:4%;top:70px;transform:rotate(5deg);width:54%;animation-delay:-1.6s}
.fc.f3{left:16%;bottom:0;padding:8px;animation-delay:-3s}
.fc.flagc .flag{width:76px;height:50px}
.pz-mini{position:absolute;right:6%;bottom:10px;display:flex;gap:4px;animation:bob 4s -2s ease-in-out infinite}
.pz-mini i{width:24px;height:24px;border-radius:5px;background:#18AE79}.pz-mini i.p{background:#F5B800}.pz-mini i.a{background:#787C99}
.hh-art .mini-blocks{left:auto;right:40%;bottom:-8px}
@media (max-width:760px){.home-hero{grid-template-columns:1fr;padding:24px}.hh-art{display:none}}
.home-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-block:18px}
@media (max-width:760px){.home-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.hs-tile{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:12px;align-items:center;text-align:left;background:var(--card);border:0;border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);cursor:pointer;transition:transform .18s,box-shadow .18s}
.hs-tile:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.hs-tile b{font-size:24px;font-variant-numeric:tabular-nums;line-height:1.1}
.hs-tile>span:last-child{grid-column:2;font-size:13px;color:var(--muted);font-weight:600}
.hs-ic{grid-row:1/3;width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
.hs-ic svg{width:26px;height:26px}
.hs-ic.fire{background:#FFF0E6}.hs-ic.pz{background:#E2F7EF}.hs-ic.bk{background:var(--accent-soft);color:var(--link)}.hs-ic.gp{background:#F0EBFF;color:#7A4DFF}
.home-h{font-size:20px!important}
.continue{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;background:var(--card);border-radius:16px;padding:20px 22px;box-shadow:var(--shadow);border-left:5px solid var(--accent)}
.ct-info{display:grid;gap:6px;min-width:0;flex:1;justify-items:start}
.ct-info p{max-width:100%}
.ct-info h3{font-size:22px}
.ct-info p{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ct-actions{display:flex;gap:8px;flex-wrap:wrap}
.home-foot{margin-top:40px;text-align:center;color:var(--muted);font-size:13px}

/* ---------- AI chip + settings ---------- */
.ai-chip{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.ai-chip .spark{width:14px;height:14px}
.ai-chip.on{color:var(--ai);background:var(--ai-soft)}
.ai-chip.busy span{font-variant-numeric:tabular-nums}
.ai-chip.busy .spark{animation:spinSlow 1.2s linear infinite}
@keyframes spinSlow{to{transform:rotate(360deg)}}
@media (max-width:560px){.ai-chip span{display:none}#snd{display:none}}
.ai-modal{width:min(560px,100%)}
.ai-src{background:var(--paper);border:2px solid transparent;border-radius:12px;padding:14px;display:grid;gap:10px}
.ai-src.active{border-color:var(--ai)}
.src-h{display:flex;gap:12px;align-items:flex-start}
.src-h>div{display:grid;gap:2px}.src-h span:not(.src-ic){font-size:13px;color:var(--muted)}
.src-ic{width:38px;height:38px;flex:none;border-radius:10px;display:grid;place-items:center}
.src-ic svg{width:20px;height:20px}
.src-ic.dev{background:#E2F7EF;color:#18AE79}.src-ic.srv{background:var(--accent-soft);color:var(--link)}.src-ic.cl{background:var(--ai-soft);color:var(--ai)}
.model-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:480px){.model-pick{grid-template-columns:1fr}}
.mp{position:relative;display:grid;gap:3px;background:var(--card);border:2px solid var(--rule);border-radius:10px;padding:10px 12px;cursor:pointer;font-size:13px}
.mp input{position:absolute;opacity:0;pointer-events:none}
.mp.sel{border-color:var(--accent);background:var(--accent-soft)}
.mp b{font-size:15px}.mp span{color:var(--muted)}.mp small{font-weight:700;color:var(--link)}
.mp:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.ai-note{font-size:13px;color:var(--muted)}
.ai-note.good{color:var(--go);font-weight:700}.ai-note.bad{color:var(--bad);font-weight:600}
.dl{display:grid;gap:6px}
.dl-bar{height:10px;border-radius:999px;background:var(--rule);overflow:hidden}
.dl-bar i{display:block;height:100%;background:linear-gradient(90deg,#18AE79,#4255FF);transition:width .3s}

/* ---------- compact, polished game frame ---------- */
.modebar,.game{max-width:860px;margin-inline:auto}
.modebar{margin-bottom:14px}
.game{padding:16px 18px;border-radius:20px}
.game.flash-good{animation:glowGood .55s ease-out}
.game.flash-bad{animation:glowBad .55s ease-out}
@keyframes glowGood{0%{box-shadow:0 0 0 3px rgba(35,196,131,.95),0 0 40px rgba(35,196,131,.55),0 24px 60px -24px rgba(20,18,71,.6)}100%{box-shadow:0 0 0 0 rgba(35,196,131,0),0 0 0 rgba(35,196,131,0),0 24px 60px -24px rgba(20,18,71,.6)}}
@keyframes glowBad{0%{box-shadow:0 0 0 3px rgba(255,93,108,.95),0 0 40px rgba(255,93,108,.5),0 24px 60px -24px rgba(20,18,71,.6)}100%{box-shadow:0 0 0 0 rgba(255,93,108,0),0 0 0 rgba(255,93,108,0),0 24px 60px -24px rgba(20,18,71,.6)}}
